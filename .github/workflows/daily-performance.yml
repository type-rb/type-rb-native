name: Daily performance snapshot

on:
  schedule:
    # 06:23 JST. Scheduled work is diagnostic, never a PR or merge dependency.
    - cron: '23 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Measure even when performance inputs have not changed
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-performance
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the last measured state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/daily-performance/state.py restore --state "$RUNNER_TEMP/daily/state.json"

      - name: Skip unchanged performance inputs
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          if test "$FORCE" = true; then
            python3 tools/daily-performance/state.py plan --state "$RUNNER_TEMP/daily/state.json" --output "$GITHUB_OUTPUT" --force
          else
            python3 tools/daily-performance/state.py plan --state "$RUNNER_TEMP/daily/state.json" --output "$GITHUB_OUTPUT"
          fi

      - name: Resolve the exact reference compiler
        if: steps.plan.outputs.measure == 'true'
        id: reference
        run: echo "revision=$(cat TYPE_RB_REVISION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.plan.outputs.measure == 'true'
        with:
          repository: type-rb/type-rb
          ref: ${{ steps.reference.outputs.revision }}
          path: .type-rb

      - uses: actions/setup-go@v6
        if: steps.plan.outputs.measure == 'true'
        with:
          go-version-file: .type-rb/go.mod
          cache-dependency-path: .type-rb/go.sum

      - name: Prepare the registered toolchain and seed
        if: steps.plan.outputs.measure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld jq strace time
          test "$(git -C .type-rb rev-parse HEAD)" = "$(cat TYPE_RB_REVISION)"
          go build -C .type-rb -trimpath -o "$RUNNER_TEMP/trb" ./cmd/trb
          curl --fail -L https://c9x.me/compile/release/qbe-1.3.tar.xz -o "$RUNNER_TEMP/qbe.tar.xz"
          echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  $RUNNER_TEMP/qbe.tar.xz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe.tar.xz"
          make -C "$RUNNER_TEMP/qbe-1.3"
          /bin/sh tools/bootstrap-seed-download.sh bootstrap-seed-2026-09-09-record-arrays \
            db48f64f6c3f6ce3fb904b2d28c95fa46522ebfc \
            type-rb-native-bootstrap-linux-arm64 "$RUNNER_TEMP/release"

      - name: Close the current, previous and frozen compiler chains
        if: steps.plan.outputs.measure == 'true'
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: |
          /bin/sh tools/daily-performance/prepare-compilers.sh \
            "$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64" \
            "$RUNNER_TEMP/qbe-1.3/qbe" "$PREVIOUS" "$RUNNER_TEMP/compilers"

      - name: Measure the daily suite
        if: steps.plan.outputs.measure == 'true'
        id: measurement
        run: |
          sudo swapoff -a
          python3 tools/daily-performance/measure.py \
            --compilers "$RUNNER_TEMP/compilers/compilers.json" --qbe "$RUNNER_TEMP/qbe-1.3/qbe" \
            --evidence "$RUNNER_TEMP/measurements" --output "$RUNNER_TEMP/snapshot.json"

      - name: Record results or preserve the last snapshot after an infrastructure failure
        if: always() && steps.plan.outputs.measure == 'true'
        env:
          MEASUREMENT_STATUS: ${{ steps.measurement.outcome }}
        run: |
          python3 tools/daily-performance/state.py finish --state "$RUNNER_TEMP/daily/state.json" \
            --snapshot "$RUNNER_TEMP/snapshot.json" --status "$MEASUREMENT_STATUS"

      - name: Retain state, including unchanged days
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: daily-performance-state
          path: ${{ runner.temp }}/daily/state.json
          retention-days: 90
          if-no-files-found: error

      - name: Retain exact measurements and compiler evidence
        if: always() && steps.plan.outputs.measure == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-performance-evidence
          path: |
            ${{ runner.temp }}/measurements
            ${{ runner.temp }}/compilers/*/evidence
            ${{ runner.temp }}/compilers/*/metadata.json
            ${{ runner.temp }}/compilers/*/*.trace
            ${{ runner.temp }}/snapshot.json
          retention-days: 90
          if-no-files-found: warn

      - name: Report the update without gating development
        if: always() && steps.restore.outcome == 'success'
        run: |
          python3 - "$RUNNER_TEMP/daily/state.json" <<'PY'
          import json, os, sys
          state = json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Daily performance is independent of PR acceptance.\n\n')
              out.write(f"Latest attempt: {(state.get('attempt') or {}).get('status', 'not measured')}\n")
          PY
