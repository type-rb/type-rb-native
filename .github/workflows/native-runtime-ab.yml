name: Nonnegative loop index A/B

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_REVISION: 05d53927d101455c4ead50165a4b028bb39c1cb4
  NATIVE_RUNTIME_AB_CONTRACT: nonnegative-loop-index
  RELEASE_TAG: bootstrap-seed-2026-08-30
  SEED_SHA256: b4307c244edc9e4da620f2a7c1b03a733e575da032efefae615f9edf75048a37
  QBE_VERSION: "1.3"
  QBE_ARCHIVE_SHA256: d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320
  BENCH_EXEC_VERSION: "3.35"
  BENCH_EXEC_DEB_SHA256: b6e42daf63a0284b597f1d05f0daf7690381f7ca9ebe21d0b5083495d01bbfe0

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify and materialize the registered baseline
        run: |
          git cat-file -e "$BASELINE_REVISION^{commit}"
          git merge-base --is-ancestor "$BASELINE_REVISION" HEAD
          git worktree add --detach "$RUNNER_TEMP/baseline-source" "$BASELINE_REVISION"
          test "$(git -C "$RUNNER_TEMP/baseline-source" rev-parse HEAD)" = "$BASELINE_REVISION"

      - name: Install the registered Linux measurement toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq lld strace
          curl -L \
            "https://github.com/sosy-lab/benchexec/releases/download/$BENCH_EXEC_VERSION/benchexec_$BENCH_EXEC_VERSION-1_all.deb" \
            -o "$RUNNER_TEMP/benchexec_$BENCH_EXEC_VERSION-1_all.deb"
          echo "$BENCH_EXEC_DEB_SHA256  $RUNNER_TEMP/benchexec_$BENCH_EXEC_VERSION-1_all.deb" |
            sha256sum -c -
          (
            cd "$RUNNER_TEMP"
            sudo apt-get install -y --install-recommends \
              "./benchexec_$BENCH_EXEC_VERSION-1_all.deb"
          )
          test "$(runexec --version)" = "runexec $BENCH_EXEC_VERSION"

      - name: Build pinned QBE 1.3
        id: qbe
        run: |
          curl -L "https://c9x.me/compile/release/qbe-$QBE_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz"
          echo "$QBE_ARCHIVE_SHA256  $RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz" |
            sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz"
          make -C "$RUNNER_TEMP/qbe-$QBE_VERSION"
          echo "path=$RUNNER_TEMP/qbe-$QBE_VERSION/qbe" >> "$GITHUB_OUTPUT"

      - name: Download and verify the immutable Linux Native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" \
            --pattern type-rb-native-bootstrap-linux-arm64
          echo "$SEED_SHA256  $RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64" |
            sha256sum -c -
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release/release.json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '.immutable == true and .draft == false and .prerelease == true and .tag_name == $tag' \
            "$RUNNER_TEMP/release/release.json"
          chmod 0755 "$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64"

      - name: Close the candidate and baseline self-hosted compiler chains
        env:
          QBE: ${{ steps.qbe.outputs.path }}
        run: |
          seed="$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64"
          mkdir -p \
            "$RUNNER_TEMP/transition/first" \
            "$RUNNER_TEMP/transition/current" \
            "$RUNNER_TEMP/transition/baseline"
          "$seed" build compiler/gate4/src/compiler.trb \
            --output "$RUNNER_TEMP/transition/first/compiler" \
            --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0
          "$RUNNER_TEMP/transition/first/compiler" build compiler/gate4/src/compiler.trb \
            --output "$RUNNER_TEMP/transition/current/compiler" \
            --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0
          "$RUNNER_TEMP/transition/current/compiler" build \
            "$RUNNER_TEMP/baseline-source/compiler/gate4/src/compiler.trb" \
            --output "$RUNNER_TEMP/transition/baseline/compiler" \
            --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0

          # Use one observer for both source revisions. The baseline compiler
          # and repository root remain exact; only the candidate's measurement
          # controller adds the CPU column consumed below.
          /bin/sh tools/bootstrap-seed.sh \
            --mode previous \
            --input "$RUNNER_TEMP/transition/baseline/compiler" \
            --input-role transition \
            --qbe "$QBE" \
            --cc /usr/bin/cc \
            --profile linux-arm64-v0 \
            --runner-image ubuntu-24.04-arm \
            --workspace "$RUNNER_TEMP/baseline-bootstrap-workspace" \
            --output "$RUNNER_TEMP/baseline-compiler" \
            --evidence "$RUNNER_TEMP/baseline-bootstrap-evidence" \
            --metadata "$RUNNER_TEMP/baseline-bootstrap-metadata.json" \
            --asset-name native-runtime-ab-baseline \
            --repository-root "$RUNNER_TEMP/baseline-source"

          /bin/sh tools/bootstrap-seed.sh \
            --mode previous \
            --input "$RUNNER_TEMP/transition/current/compiler" \
            --input-role transition \
            --qbe "$QBE" \
            --cc /usr/bin/cc \
            --profile linux-arm64-v0 \
            --runner-image ubuntu-24.04-arm \
            --workspace "$RUNNER_TEMP/candidate-bootstrap-workspace" \
            --output "$RUNNER_TEMP/candidate-compiler" \
            --evidence "$RUNNER_TEMP/candidate-bootstrap-evidence" \
            --metadata "$RUNNER_TEMP/candidate-bootstrap-metadata.json" \
            --asset-name native-runtime-ab-candidate

      - name: Enforce compiler compactness and build-cost guardrails
        run: |
          evidence="$RUNNER_TEMP/compiler-comparison-evidence"
          mkdir -p "$evidence"
          printf 'metric\tstage\tbaseline\tcandidate\tcandidate_baseline_ratio\tmaximum_ratio\tstatus\n' \
            > "$evidence/comparison.tsv"
          comparison_failed=0

          compare() {
            metric=$1
            stage=$2
            baseline=$3
            candidate=$4
            maximum=$5
            ratio=$(awk -v baseline="$baseline" -v candidate="$candidate" 'BEGIN {
              if (baseline !~ /^[0-9]+([.][0-9]+)?$/ ||
                  candidate !~ /^[0-9]+([.][0-9]+)?$/ || baseline <= 0 || candidate <= 0) {
                print "invalid"
              } else {
                printf "%.6f", candidate / baseline
              }
            }')
            status=pass
            if test "$ratio" = invalid || ! awk -v ratio="$ratio" -v maximum="$maximum" \
              'BEGIN { exit !(ratio + 0 <= maximum + 0) }'; then
              status=fail
              comparison_failed=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$metric" "$stage" "$baseline" "$candidate" "$ratio" "$maximum" "$status" \
              >> "$evidence/comparison.tsv"
          }

          metric() {
            path=$1
            stage=$2
            key=$3
            awk -v stage="$stage" -v key="$key" '
              $1 == stage {
                for (field_index = 2; field_index <= NF; field_index += 1) {
                  split($field_index, pair, "=")
                  if (pair[1] == key) print pair[2]
                }
              }
            ' "$path"
          }

          compare compiler_bytes fixed-point \
            "$(wc -c < "$RUNNER_TEMP/baseline-compiler" | tr -d ' ')" \
            "$(wc -c < "$RUNNER_TEMP/candidate-compiler" | tr -d ' ')" \
            1.01
          candidate_compiler_bytes=$(wc -c < "$RUNNER_TEMP/candidate-compiler" | tr -d ' ')
          compare compiler_bytes absolute 255000 "$candidate_compiler_bytes" 1.00
          for stage in b2-b3 b3-b4; do
            compare build_walltime "$stage" \
              "$(metric "$RUNNER_TEMP/baseline-bootstrap-evidence/medians.txt" "$stage" elapsed_seconds)" \
              "$(metric "$RUNNER_TEMP/candidate-bootstrap-evidence/medians.txt" "$stage" elapsed_seconds)" \
              1.05
            compare build_cputime "$stage" \
              "$(metric "$RUNNER_TEMP/baseline-bootstrap-evidence/medians.txt" "$stage" cpu_seconds)" \
              "$(metric "$RUNNER_TEMP/candidate-bootstrap-evidence/medians.txt" "$stage" cpu_seconds)" \
              1.05
            compare build_peak_rss "$stage" \
              "$(metric "$RUNNER_TEMP/baseline-bootstrap-evidence/medians.txt" "$stage" peak_rss_bytes)" \
              "$(metric "$RUNNER_TEMP/candidate-bootstrap-evidence/medians.txt" "$stage" peak_rss_bytes)" \
              1.05
          done
          test "$comparison_failed" -eq 0

      - name: Build and inventory the exact A/B applications
        env:
          QBE: ${{ steps.qbe.outputs.path }}
        run: |
          root="$RUNNER_TEMP/applications"
          mkdir -p "$root/baseline" "$root/candidate" "$RUNNER_TEMP/application-evidence"
          printf 'case\tcandidate\tcommand\tinput\texpected\n' > "$RUNNER_TEMP/catalog.tsv"
          printf 'case\tartifact\tbaseline_bytes\tcandidate_bytes\tcandidate_baseline_ratio\tmaximum_ratio\tstatus\n' \
            > "$RUNNER_TEMP/application-evidence/sizes.tsv"
          printf 'case\tbaseline_normalizations\tcandidate_normalizations\tminimum_reduction\tstatus\n' \
            > "$RUNNER_TEMP/application-evidence/nonnegative-index-normalization.tsv"

          record_size() {
            case_name=$1
            artifact=$2
            baseline_path=$3
            candidate_path=$4
            maximum=$5
            baseline=$(wc -c < "$baseline_path" | tr -d ' ')
            candidate=$(wc -c < "$candidate_path" | tr -d ' ')
            ratio=$(awk -v baseline="$baseline" -v candidate="$candidate" \
              'BEGIN { printf "%.6f", candidate / baseline }')
            status=pass
            if ! awk -v ratio="$ratio" -v maximum="$maximum" \
              'BEGIN { exit !(ratio <= maximum) }'; then
              status=fail
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$case_name" "$artifact" "$baseline" "$candidate" "$ratio" "$maximum" "$status" \
              >> "$RUNNER_TEMP/application-evidence/sizes.tsv"
            test "$status" = pass
          }

          for case_name in fannkuch-redux n-body spectral-norm; do
            case "$case_name" in
              fannkuch-redux)
                input=10
                expected="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/fannkuch-redux/expected/10.txt"
                ;;
              n-body)
                input=1000000
                expected="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/n-body/expected/1000000.txt"
                ;;
              spectral-norm)
                input=5500
                expected="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/spectral-norm/expected/5500.txt"
                ;;
            esac
            source="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/$case_name/src/main.trb"
            for candidate in baseline candidate; do
              compiler="$RUNNER_TEMP/$candidate-compiler"
              directory="$root/$candidate/$case_name"
              mkdir -p "$directory"
              "$compiler" emit-qbe "$source" > "$directory/program.ssa"
              "$QBE" -t arm64 -o "$directory/program.s" "$directory/program.ssa"
              "$compiler" build "$source" \
                --output "$directory/program" \
                --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0
              cp "$directory/program" "$directory/program.stripped"
              strip --strip-all "$directory/program.stripped"
              {
                grep -o 'call \$g4_[A-Za-z0-9_]*' "$directory/program.ssa" || true
              } | sort | uniq -c > "$directory/helper-calls.txt"
              {
                grep -o 'call \$g4f[0-9]*' "$directory/program.ssa" || true
              } | sort | uniq -c > "$directory/user-calls.txt"
              sha256sum \
                "$directory/program.ssa" \
                "$directory/program.s" \
                "$directory/helper-calls.txt" \
                "$directory/user-calls.txt" \
                "$directory/program" \
                "$directory/program.stripped" \
                > "$directory/SHA256SUMS"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$case_name" "$candidate" "$directory/program" "$input" "$expected" \
                >> "$RUNNER_TEMP/catalog.tsv"
            done
            qbe_maximum=1.00
            executable_maximum=1.001
            record_size "$case_name" qbe \
              "$root/baseline/$case_name/program.ssa" \
              "$root/candidate/$case_name/program.ssa" \
              "$qbe_maximum"
            record_size "$case_name" raw_executable \
              "$root/baseline/$case_name/program" \
              "$root/candidate/$case_name/program" \
              "$executable_maximum"
            record_size "$case_name" stripped_executable \
              "$root/baseline/$case_name/program.stripped" \
              "$root/candidate/$case_name/program.stripped" \
              "$executable_maximum"
            minimum_reduction=0
            case "$case_name" in
              n-body) minimum_reduction=6 ;;
              spectral-norm) minimum_reduction=2 ;;
            esac
            baseline_normalizations=$(awk '/=l sar .* 63/ { count += 1 } END { print count + 0 }' \
              "$root/baseline/$case_name/program.ssa")
            candidate_normalizations=$(awk '/=l sar .* 63/ { count += 1 } END { print count + 0 }' \
              "$root/candidate/$case_name/program.ssa")
            normalization_status=pass
            if test "$candidate_normalizations" -gt $((baseline_normalizations - minimum_reduction)); then
              normalization_status=fail
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$case_name" "$baseline_normalizations" "$candidate_normalizations" \
              "$minimum_reduction" "$normalization_status" \
              >> "$RUNNER_TEMP/application-evidence/nonnegative-index-normalization.tsv"
            test "$normalization_status" = pass
          done

      - name: Configure and probe the isolated measurement host
        id: host
        run: |
          mkdir -p "$RUNNER_TEMP/host-evidence"
          sudo swapoff -a
          /bin/sh tools/benchmarksgame-formal/delegate-cpuset-linux.sh \
            "$RUNNER_TEMP/host-evidence/cpuset-before-discovery.txt"
          set +e
          python3 -m benchexec.check_cgroups \
            > "$RUNNER_TEMP/host-evidence/cpuset-discovery.stdout" \
            2> "$RUNNER_TEMP/host-evidence/cpuset-discovery.stderr"
          discovery_status=$?
          set -e
          printf 'status=%s\n' "$discovery_status" \
            > "$RUNNER_TEMP/host-evidence/cpuset-discovery.status"
          /bin/sh tools/benchmarksgame-formal/delegate-cpuset-linux.sh \
            "$RUNNER_TEMP/host-evidence/cpuset-after-discovery.txt"
          python3 -m benchexec.check_cgroups \
            > "$RUNNER_TEMP/host-evidence/check-cgroups.stdout" \
            2> "$RUNNER_TEMP/host-evidence/check-cgroups.stderr"
          allowed=$(awk -F: \
            '$1 == "Cpus_allowed_list" { gsub(/[[:space:]]/, "", $2); print $2 }' \
            /proc/self/status)
          test -n "$allowed"
          printf '%s\n' "$allowed" |
            awk -F, '{
              for (group_index = 1; group_index <= NF; group_index += 1) {
                part_count = split($group_index, bounds, "-")
                first = bounds[1] + 0
                last = part_count == 1 ? first : bounds[2] + 0
                for (cpu = first; cpu <= last; cpu += 1) print cpu
              }
            }' > "$RUNNER_TEMP/host-evidence/allowed-cpus.txt"
          core=$(sed -n '1p' "$RUNNER_TEMP/host-evidence/allowed-cpus.txt")
          test -n "$core"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          {
            printf 'allowed=%s\n' "$allowed"
            printf 'core=%s\n' "$core"
          } > "$RUNNER_TEMP/host-evidence/allocation.txt"
          /bin/sh tools/benchmarksgame-formal/cache-control-linux.sh \
            "$RUNNER_TEMP/host-evidence/cache-probe.txt"
          runexec \
            --quiet \
            --memlimit 64MB \
            --walltimelimit 10s \
            --cores "$core" \
            --read-only-dir / \
            --overlay-dir /home \
            --output "$RUNNER_TEMP/host-evidence/runexec-probe.log" \
            -- /bin/true \
            > "$RUNNER_TEMP/host-evidence/runexec-probe.stdout" \
            2> "$RUNNER_TEMP/host-evidence/runexec-probe.stderr"
          grep '^returnvalue=0$' "$RUNNER_TEMP/host-evidence/runexec-probe.stdout"
          test ! -s "$RUNNER_TEMP/host-evidence/runexec-probe.stderr"

      - name: Measure all registered Native A/B cases
        env:
          CORE: ${{ steps.host.outputs.core }}
        run: |
          measurement_failed=0
          for case_name in fannkuch-redux n-body spectral-norm; do
            if ! /bin/sh tools/native-runtime-ab/runtime-controller.sh \
              formal "$(command -v runexec)" "$RUNNER_TEMP/catalog.tsv" \
              "$case_name" "$CORE" \
              tools/benchmarksgame-formal/cache-control-linux.sh \
              "$RUNNER_TEMP/runtime-$case_name-workspace" \
              "$RUNNER_TEMP/runtime-$case_name-evidence"; then
              measurement_failed=1
            fi
          done
          test "$measurement_failed" -eq 0

      - name: Record exact workflow identities
        if: always()
        run: |
          evidence="$RUNNER_TEMP/workflow-evidence"
          mkdir -p "$evidence"
          {
            printf 'candidate_revision=%s\n' "$GITHUB_SHA"
            printf 'baseline_revision=%s\n' "$BASELINE_REVISION"
            printf 'repository_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            uname -a
            /usr/bin/cc --version
            ld.lld --version
            runexec --version
            "$RUNNER_TEMP/qbe-$QBE_VERSION/qbe" -h
          } > "$evidence/environment.txt" 2>&1
          sha256sum \
            .github/workflows/native-runtime-ab.yml \
            tools/native-runtime-ab/runtime-controller.sh \
            tools/native-runtime-ab/summarize.awk \
            tools/benchmarksgame-formal/cache-control-linux.sh \
            "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz" \
            "$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64" \
            > "$evidence/SHA256SUMS"
          find "$RUNNER_TEMP" -name '*.trbn.*' -print | sort > "$evidence/temp-inventory.txt"
          test ! -s "$evidence/temp-inventory.txt"

      - name: Upload complete A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/application-evidence
            ${{ runner.temp }}/applications
            ${{ runner.temp }}/baseline-bootstrap-evidence
            ${{ runner.temp }}/baseline-bootstrap-metadata.json
            ${{ runner.temp }}/candidate-bootstrap-evidence
            ${{ runner.temp }}/candidate-bootstrap-metadata.json
            ${{ runner.temp }}/catalog.tsv
            ${{ runner.temp }}/compiler-comparison-evidence
            ${{ runner.temp }}/host-evidence
            ${{ runner.temp }}/runtime-*-evidence
            ${{ runner.temp }}/workflow-evidence
          if-no-files-found: error
          retention-days: 30
