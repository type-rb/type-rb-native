name: Native MIR foundation measurement

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_REVISION: a36c7417f0c9bc5bc9705c28ef6340a05caa5f27
  RELEASE_TAG: bootstrap-seed-2026-08-30
  SEED_SHA256: b4307c244edc9e4da620f2a7c1b03a733e575da032efefae615f9edf75048a37
  QBE_VERSION: "1.3"
  QBE_ARCHIVE_SHA256: d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320

jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create the retained evidence root
        run: mkdir -p "$RUNNER_TEMP/native-mir-foundation-evidence"

      - name: Verify and materialize the registered baseline
        run: |
          git cat-file -e "$BASELINE_REVISION^{commit}"
          git merge-base --is-ancestor "$BASELINE_REVISION" HEAD
          git worktree add --detach "$RUNNER_TEMP/baseline-source" "$BASELINE_REVISION"
          test "$(git -C "$RUNNER_TEMP/baseline-source" rev-parse HEAD)" = "$BASELINE_REVISION"

      - name: Install the registered Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq lld strace

      - name: Build pinned QBE 1.3
        id: qbe
        run: |
          curl -L "https://c9x.me/compile/release/qbe-$QBE_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz"
          echo "$QBE_ARCHIVE_SHA256  $RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz" |
            sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz"
          make -C "$RUNNER_TEMP/qbe-$QBE_VERSION"
          echo "path=$RUNNER_TEMP/qbe-$QBE_VERSION/qbe" >> "$GITHUB_OUTPUT"

      - name: Download and verify the immutable Linux Native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" \
            --pattern type-rb-native-bootstrap-linux-arm64
          echo "$SEED_SHA256  $RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64" |
            sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64"

      - name: Close the candidate and baseline self-hosted compiler chains
        env:
          QBE: ${{ steps.qbe.outputs.path }}
        run: |
          evidence="$RUNNER_TEMP/native-mir-foundation-evidence"
          seed="$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64"
          mkdir -p \
            "$RUNNER_TEMP/transition/first" \
            "$RUNNER_TEMP/transition/current" \
            "$RUNNER_TEMP/transition/baseline"

          "$seed" build compiler/gate4/src/compiler.trb \
            --output "$RUNNER_TEMP/transition/first/compiler" \
            --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0
          "$RUNNER_TEMP/transition/first/compiler" build compiler/gate4/src/compiler.trb \
            --output "$RUNNER_TEMP/transition/current/compiler" \
            --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0
          "$RUNNER_TEMP/transition/current/compiler" build \
            "$RUNNER_TEMP/baseline-source/compiler/gate4/src/compiler.trb" \
            --output "$RUNNER_TEMP/transition/baseline/compiler" \
            --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0

          /bin/sh tools/bootstrap-seed.sh \
            --mode previous \
            --input "$RUNNER_TEMP/transition/baseline/compiler" \
            --input-role transition \
            --qbe "$QBE" \
            --cc /usr/bin/cc \
            --profile linux-arm64-v0 \
            --runner-image ubuntu-24.04-arm \
            --workspace "$RUNNER_TEMP/baseline-bootstrap-workspace" \
            --output "$evidence/baseline-compiler" \
            --evidence "$evidence/baseline-bootstrap" \
            --metadata "$evidence/baseline-bootstrap.json" \
            --asset-name native-mir-foundation-baseline \
            --repository-root "$RUNNER_TEMP/baseline-source"

          /bin/sh tools/bootstrap-seed.sh \
            --mode previous \
            --input "$RUNNER_TEMP/transition/current/compiler" \
            --input-role transition \
            --qbe "$QBE" \
            --cc /usr/bin/cc \
            --profile linux-arm64-v0 \
            --runner-image ubuntu-24.04-arm \
            --workspace "$RUNNER_TEMP/candidate-bootstrap-workspace" \
            --output "$evidence/candidate-compiler" \
            --evidence "$evidence/candidate-bootstrap" \
            --metadata "$evidence/candidate-bootstrap.json" \
            --asset-name native-mir-foundation-candidate

      - name: Record the structural compiler delta without judging it
        run: |
          evidence="$RUNNER_TEMP/native-mir-foundation-evidence"
          output="$evidence/compiler-comparison.tsv"
          printf 'metric\tstage\tbaseline\tcandidate\tdelta\tcandidate_baseline_ratio\n' > "$output"

          record() {
            metric=$1
            stage=$2
            baseline=$3
            candidate=$4
            ratio=$(awk -v baseline="$baseline" -v candidate="$candidate" 'BEGIN {
              if (baseline !~ /^[0-9]+([.][0-9]+)?$/ ||
                  candidate !~ /^[0-9]+([.][0-9]+)?$/ || baseline <= 0 || candidate <= 0) {
                print "invalid"
              } else {
                printf "%.6f", candidate / baseline
              }
            }')
            test "$ratio" != invalid
            delta=$(awk -v baseline="$baseline" -v candidate="$candidate" \
              'BEGIN { printf "%.9g", candidate - baseline }')
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$metric" "$stage" "$baseline" "$candidate" "$delta" "$ratio" >> "$output"
          }

          metric() {
            path=$1
            stage=$2
            key=$3
            awk -v stage="$stage" -v key="$key" '
              $1 == stage {
                for (field_index = 2; field_index <= NF; field_index += 1) {
                  split($field_index, pair, "=")
                  if (pair[1] == key) print pair[2]
                }
              }
            ' "$path"
          }

          record compiler_bytes fixed-point \
            "$(wc -c < "$evidence/baseline-compiler" | tr -d ' ')" \
            "$(wc -c < "$evidence/candidate-compiler" | tr -d ' ')"
          for stage in b2-b3 b3-b4; do
            record build_walltime "$stage" \
              "$(metric "$evidence/baseline-bootstrap/medians.txt" "$stage" elapsed_seconds)" \
              "$(metric "$evidence/candidate-bootstrap/medians.txt" "$stage" elapsed_seconds)"
            record build_cputime "$stage" \
              "$(metric "$evidence/baseline-bootstrap/medians.txt" "$stage" cpu_seconds)" \
              "$(metric "$evidence/candidate-bootstrap/medians.txt" "$stage" cpu_seconds)"
            record build_peak_rss "$stage" \
              "$(metric "$evidence/baseline-bootstrap/medians.txt" "$stage" peak_rss_bytes)" \
              "$(metric "$evidence/candidate-bootstrap/medians.txt" "$stage" peak_rss_bytes)"
          done

      - name: Require byte-identical existing application output
        env:
          QBE: ${{ steps.qbe.outputs.path }}
        run: |
          evidence="$RUNNER_TEMP/native-mir-foundation-evidence"
          root="$evidence/applications"
          mkdir -p "$root/baseline" "$root/candidate"
          printf 'case\tartifact\tbaseline_bytes\tcandidate_bytes\tidentical\n' \
            > "$evidence/application-comparison.tsv"

          for case_name in fannkuch-redux n-body spectral-norm; do
            case "$case_name" in
              fannkuch-redux)
                input=10
                expected="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/fannkuch-redux/expected/10.txt"
                ;;
              n-body)
                input=1000000
                expected="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/n-body/expected/1000000.txt"
                ;;
              spectral-norm)
                input=5500
                expected="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/spectral-norm/expected/5500.txt"
                ;;
            esac
            source="$GITHUB_WORKSPACE/benchmarks/benchmarksgame/$case_name/src/main.trb"
            for candidate in baseline candidate; do
              directory="$root/$candidate/$case_name"
              mkdir -p "$directory"
              "$evidence/$candidate-compiler" emit-qbe "$source" > "$directory/program.ssa"
              "$QBE" -t arm64 -o "$directory/program.s" "$directory/program.ssa"
              "$evidence/$candidate-compiler" build "$source" \
                --output "$directory/program" \
                --qbe "$QBE" --cc /usr/bin/cc --target linux-arm64-v0
              cp "$directory/program" "$directory/program.stripped"
              strip --strip-all "$directory/program.stripped"
              "$directory/program" "$input" > "$directory/stdout" 2> "$directory/stderr"
              cmp "$expected" "$directory/stdout"
              test ! -s "$directory/stderr"
              sha256sum \
                "$directory/program.ssa" \
                "$directory/program.s" \
                "$directory/program" \
                "$directory/program.stripped" \
                "$directory/stdout" \
                "$directory/stderr" \
                > "$directory/SHA256SUMS"
            done
            for artifact in program.ssa program program.stripped; do
              baseline="$root/baseline/$case_name/$artifact"
              candidate="$root/candidate/$case_name/$artifact"
              identical=no
              if cmp "$baseline" "$candidate"; then
                identical=yes
              fi
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$case_name" "$artifact" \
                "$(wc -c < "$baseline" | tr -d ' ')" \
                "$(wc -c < "$candidate" | tr -d ' ')" \
                "$identical" >> "$evidence/application-comparison.tsv"
              test "$identical" = yes
            done
          done

      - name: Retain exact identities and cleanup evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/native-mir-foundation-evidence"
          mkdir -p "$evidence/workflow"
          {
            printf 'candidate_revision=%s\n' "$GITHUB_SHA"
            printf 'baseline_revision=%s\n' "$BASELINE_REVISION"
            printf 'runner_image=%s\n' "ubuntu-24.04-arm"
            uname -a
            /usr/bin/cc --version
            ld.lld --version
          } > "$evidence/workflow/environment.txt" 2>&1
          sha256sum \
            .github/workflows/native-mir-foundation.yml \
            tools/bootstrap-seed.sh \
            > "$evidence/workflow/source-sha256.txt"
          find "$GITHUB_WORKSPACE" \
            \( -name '*.trbn.*' -o -name '*.gate6n-external.*' \) -print \
            > "$evidence/workflow/temp-inventory.txt"
          test ! -s "$evidence/workflow/temp-inventory.txt"

      - name: Upload the complete Phase A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mir-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-mir-foundation-evidence
          if-no-files-found: error
          retention-days: 30
