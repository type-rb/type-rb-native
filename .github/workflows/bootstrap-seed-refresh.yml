name: Refresh the experimental Native seed

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare attested assets, or verify the immutable published release
        required: true
        default: prepare
        type: choice
        options: [prepare, verify]

permissions:
  contents: read

concurrency:
  group: bootstrap-seed-refresh
  cancel-in-progress: false

jobs:
  target:
    name: ${{ inputs.mode }} ${{ matrix.target }}
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            profile: darwin-arm64-v0
            target: darwin-arm64
          - runner: ubuntu-24.04-arm
            profile: linux-arm64-v0
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.mode == 'verify' && 'bootstrap-seed-2026-09-08' || github.sha }}
      - name: Record the exact accepted source and observer
        env:
          MODE: ${{ inputs.mode }}
        run: |
          test "$MODE" = prepare || test "$MODE" = verify
          mkdir -p "$RUNNER_TEMP/context"
          git rev-parse HEAD > "$RUNNER_TEMP/context/source-revision.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/context/dispatch-revision.txt"
          git ls-tree -r HEAD compiler > "$RUNNER_TEMP/context/compiler-tree.txt"
      - name: Build pinned QBE
        run: |
          curl --fail --location https://c9x.me/compile/release/qbe-1.3.tar.xz -o "$RUNNER_TEMP/qbe-1.3.tar.xz"
          python3 -c 'import hashlib,sys; assert hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest()=="d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320"' "$RUNNER_TEMP/qbe-1.3.tar.xz"
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-1.3.tar.xz"
          make -C "$RUNNER_TEMP/qbe-1.3"
      - name: Install Linux system observer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld strace
      - name: Authenticate the published input before execution
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ matrix.target }}
        run: |
          tag=bootstrap-seed-2026-09-07
          revision=1f7e8a110bbb2b13f0609709deb6fc8f09dc8b44
          if test "$MODE" = verify; then
            tag=bootstrap-seed-2026-09-08
            revision=$(git rev-parse HEAD)
          fi
          /bin/sh tools/bootstrap-seed-download.sh "$tag" "$revision" \
            "type-rb-native-bootstrap-$TARGET" "$RUNNER_TEMP/input"
      - name: Verify generations, corpus, process boundary and cost
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ matrix.profile }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          /bin/sh tools/bootstrap-seed-refresh.sh "$MODE" \
            "$RUNNER_TEMP/input/type-rb-native-bootstrap-$TARGET" \
            "$RUNNER_TEMP/qbe-1.3/qbe" "$PROFILE" "$RUNNER_LABEL" \
            "$RUNNER_TEMP/refresh" "$RUNNER_TEMP/package"
      - name: Attest the prepared compiler
        if: inputs.mode == 'prepare'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/package/type-rb-native-bootstrap-${{ matrix.target }}
      - name: Upload verified target package
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ inputs.mode }}-${{ matrix.target }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 30
      - name: Inventory temporary files even after failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/context"
          find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -name '*.trbn.*' -print > "$RUNNER_TEMP/context/temporary-inventory.txt"
      - name: Retain verification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ inputs.mode }}-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/context
            ${{ runner.temp }}/input
            ${{ runner.temp }}/refresh/evidence
            ${{ runner.temp }}/refresh/trace
          if-no-files-found: error
          retention-days: 30

  package:
    needs: target
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.mode == 'verify' && 'bootstrap-seed-2026-09-08' || github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: seed-${{ inputs.mode }}-darwin-arm64
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@v5
        with:
          name: seed-${{ inputs.mode }}-linux-arm64
          path: ${{ runner.temp }}/inputs
      - name: Validate paired target identities and bounds
        run: |
          python3 tools/bootstrap-seed-release.py create "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/release-assets"
      - name: Attest manifest and checksum index
        if: inputs.mode == 'prepare'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/type-rb-native-bootstrap-manifest-v2.json
            ${{ runner.temp }}/release-assets/SHA256SUMS
      - name: Retain reviewed release assets
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ inputs.mode }}-release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 30
