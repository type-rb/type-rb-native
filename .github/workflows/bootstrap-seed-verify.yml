name: Verify published bootstrap seed

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published experimental bootstrap seed tag
        required: true
        default: bootstrap-seed-2026-08-30
        type: string
      compiler_source:
        description: Compiler source and fixtures to rebuild from the verified seed
        required: true
        default: release-tag
        type: choice
        options:
          - release-tag
          - workflow-revision

permissions:
  contents: read

jobs:
  verify-target:
    name: Verify ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            profile: darwin-arm64-v0
            target: darwin-arm64
            asset: type-rb-native-bootstrap-darwin-arm64
          - runner: ubuntu-24.04-arm
            profile: linux-arm64-v0
            target: linux-arm64
            asset: type-rb-native-bootstrap-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the published Native revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Check out the exact verification tooling revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .bootstrap-verifier

      - name: Build pinned QBE 1.3
        id: qbe
        run: |
          curl -L https://c9x.me/compile/release/qbe-1.3.tar.xz -o "$RUNNER_TEMP/qbe-1.3.tar.xz"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  $RUNNER_TEMP/qbe-1.3.tar.xz" | sha256sum -c -
          else
            echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  $RUNNER_TEMP/qbe-1.3.tar.xz" | shasum -a 256 -c -
          fi
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-1.3.tar.xz"
          make -C "$RUNNER_TEMP/qbe-1.3"
          echo "path=$RUNNER_TEMP/qbe-1.3/qbe" >> "$GITHUB_OUTPUT"

      - name: Ensure Linux linker and process tracing are available
        if: matrix.profile == 'linux-arm64-v0'
        run: |
          if ! command -v strace >/dev/null 2>&1 || ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lld strace
          fi

      - name: Download only the ordinary seed inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_ASSET: ${{ matrix.asset }}
        run: |
          test "$RELEASE_TAG" = bootstrap-seed-2026-08-30
          mkdir -p "$RUNNER_TEMP/release"
          started=$(date +%s)
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" \
            --pattern "$TARGET_ASSET" \
            --pattern type-rb-native-bootstrap-manifest-v1.json \
            --pattern SHA256SUMS
          finished=$(date +%s)
          printf 'download_seconds=%s\n' "$((finished - started))" > "$RUNNER_TEMP/download-time.txt"
          test ! -e "$RUNNER_TEMP/release/type-rb-native-bootstrap-root-qbe-v1.ssa"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"

      - name: Verify release state, manifest, digests, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_ASSET: ${{ matrix.asset }}
        run: |
          revision=$(git rev-parse HEAD)
          started=$(date +%s)
          /bin/sh .bootstrap-verifier/tools/bootstrap-seed-manifest.sh verify \
            "$RELEASE_TAG" \
            "$revision" \
            "$TARGET_ASSET" \
            "$RUNNER_TEMP/release/$TARGET_ASSET" \
            "$RUNNER_TEMP/release/type-rb-native-bootstrap-manifest-v1.json" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release.json"
          gh attestation verify \
            "$RUNNER_TEMP/release/$TARGET_ASSET" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow type-rb/type-rb-native/.github/workflows/bootstrap-seed-initial.yml \
            --source-digest "$revision" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/compiler-attestation.json"
          gh attestation verify \
            "$RUNNER_TEMP/release/type-rb-native-bootstrap-manifest-v1.json" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow type-rb/type-rb-native/.github/workflows/bootstrap-seed-initial.yml \
            --source-digest "$revision" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/manifest-attestation.json"
          gh attestation verify \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow type-rb/type-rb-native/.github/workflows/bootstrap-seed-initial.yml \
            --source-digest "$revision" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/checksums-attestation.json"
          finished=$(date +%s)
          printf 'verification_seconds=%s\n' "$((finished - started))" > "$RUNNER_TEMP/verification-time.txt"
          chmod 0755 "$RUNNER_TEMP/release/$TARGET_ASSET"

      - name: Build setup-only current-source transitions
        id: transition
        if: inputs.compiler_source == 'workflow-revision'
        env:
          PUBLISHED_SEED: ${{ runner.temp }}/release/${{ matrix.asset }}
          PROFILE: ${{ matrix.profile }}
        run: |
          repository_root="$GITHUB_WORKSPACE/.bootstrap-verifier"
          compiler_entry="$repository_root/compiler/gate4/src/compiler.trb"
          mkdir -p \
            "$RUNNER_TEMP/transition/first" \
            "$RUNNER_TEMP/transition/current-runtime" \
            "$RUNNER_TEMP/transition-evidence"
          started=$(date +%s)
          if test "$PROFILE" = linux-arm64-v0; then
            strace -f -e trace=process -o "$RUNNER_TEMP/transition-evidence/first-process.trace" \
              "$PUBLISHED_SEED" build "$compiler_entry" \
                --output "$RUNNER_TEMP/transition/first/compiler" \
                --qbe "${{ steps.qbe.outputs.path }}" \
                --cc /usr/bin/cc \
                --target "$PROFILE" \
                > "$RUNNER_TEMP/transition-evidence/first.stdout" \
                2> "$RUNNER_TEMP/transition-evidence/first.stderr"
            test -x "$RUNNER_TEMP/transition/first/compiler"
            strace -f -e trace=process -o "$RUNNER_TEMP/transition-evidence/current-runtime-process.trace" \
              "$RUNNER_TEMP/transition/first/compiler" build "$compiler_entry" \
                --output "$RUNNER_TEMP/transition/current-runtime/compiler" \
                --qbe "${{ steps.qbe.outputs.path }}" \
                --cc /usr/bin/cc \
                --target "$PROFILE" \
                > "$RUNNER_TEMP/transition-evidence/current-runtime.stdout" \
                2> "$RUNNER_TEMP/transition-evidence/current-runtime.stderr"
            grep execve "$RUNNER_TEMP/transition-evidence/first-process.trace" \
              > "$RUNNER_TEMP/transition-evidence/process-inventory.txt"
            grep execve "$RUNNER_TEMP/transition-evidence/current-runtime-process.trace" \
              >> "$RUNNER_TEMP/transition-evidence/process-inventory.txt"
            if grep -E 'execve\("[^"]*/(go|trb|sh|bash|zsh)"' \
              "$RUNNER_TEMP/transition-evidence/first-process.trace" \
              "$RUNNER_TEMP/transition-evidence/current-runtime-process.trace" > /dev/null; then
              printf 'setup transition launched a forbidden executable\n' >&2
              exit 1
            fi
            grep -E 'execve\("[^"]*/ld\.lld"' \
              "$RUNNER_TEMP/transition-evidence/current-runtime-process.trace" > /dev/null
          else
            "$PUBLISHED_SEED" build "$compiler_entry" \
              --output "$RUNNER_TEMP/transition/first/compiler" \
              --qbe "${{ steps.qbe.outputs.path }}" \
              --cc /usr/bin/cc \
              --target "$PROFILE" \
              > "$RUNNER_TEMP/transition-evidence/first.stdout" \
              2> "$RUNNER_TEMP/transition-evidence/first.stderr"
            test -x "$RUNNER_TEMP/transition/first/compiler"
            "$RUNNER_TEMP/transition/first/compiler" build "$compiler_entry" \
              --output "$RUNNER_TEMP/transition/current-runtime/compiler" \
              --qbe "${{ steps.qbe.outputs.path }}" \
              --cc /usr/bin/cc \
              --target "$PROFILE" \
              > "$RUNNER_TEMP/transition-evidence/current-runtime.stdout" \
              2> "$RUNNER_TEMP/transition-evidence/current-runtime.stderr"
            {
              printf 'setup controller: workflow shell\n'
              printf 'first compiler: published Native seed\n'
              printf 'second compiler: first current-source transition\n'
              printf 'compiler child boundary: %s\n' '${{ steps.qbe.outputs.path }}'
              printf 'compiler child boundary: %s\n' /usr/bin/cc
              printf 'forbidden compiler children: Go, reference trb, recovery compiler, shell\n'
            } > "$RUNNER_TEMP/transition-evidence/process-inventory.txt"
          fi
          finished=$(date +%s)
          test -x "$RUNNER_TEMP/transition/current-runtime/compiler"
          test ! -s "$RUNNER_TEMP/transition-evidence/first.stdout"
          test ! -s "$RUNNER_TEMP/transition-evidence/first.stderr"
          test ! -s "$RUNNER_TEMP/transition-evidence/current-runtime.stdout"
          test ! -s "$RUNNER_TEMP/transition-evidence/current-runtime.stderr"
          chmod 0755 \
            "$RUNNER_TEMP/transition/first/compiler" \
            "$RUNNER_TEMP/transition/current-runtime/compiler"
          {
            printf 'elapsed_seconds=%s\n' "$((finished - started))"
            printf 'compiler_source=%s\n' "$compiler_entry"
            printf 'compiler_source_revision=%s\n' "$(git -C "$repository_root" rev-parse HEAD)"
            printf 'profile=%s\n' "$PROFILE"
            printf 'qbe=%s\n' '${{ steps.qbe.outputs.path }}'
            printf 'cc=%s\n' /usr/bin/cc
            printf 'published_seed_size=%s\n' "$(wc -c < "$PUBLISHED_SEED" | tr -d ' ')"
            printf 'first_transition_size=%s\n' "$(wc -c < "$RUNNER_TEMP/transition/first/compiler" | tr -d ' ')"
            printf 'current_runtime_transition_size=%s\n' "$(wc -c < "$RUNNER_TEMP/transition/current-runtime/compiler" | tr -d ' ')"
          } > "$RUNNER_TEMP/transition-evidence/identities.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum \
              "$PUBLISHED_SEED" \
              "$RUNNER_TEMP/transition/first/compiler" \
              "$RUNNER_TEMP/transition/current-runtime/compiler" \
              > "$RUNNER_TEMP/transition-evidence/SHA256SUMS"
          else
            shasum -a 256 \
              "$PUBLISHED_SEED" \
              "$RUNNER_TEMP/transition/first/compiler" \
              "$RUNNER_TEMP/transition/current-runtime/compiler" \
              > "$RUNNER_TEMP/transition-evidence/SHA256SUMS"
          fi

      - name: Close the ordinary previous-Native chain
        id: chain
        run: |
          repository_root="$GITHUB_WORKSPACE"
          compiler_input="$RUNNER_TEMP/release/${{ matrix.asset }}"
          input_role=ordinary
          if test "${{ inputs.compiler_source }}" = workflow-revision; then
            repository_root="$GITHUB_WORKSPACE/.bootstrap-verifier"
            compiler_input="$RUNNER_TEMP/transition/current-runtime/compiler"
            input_role=transition
          fi
          mkdir -p "$RUNNER_TEMP/package"
          /bin/sh .bootstrap-verifier/tools/bootstrap-seed.sh \
            --mode previous \
            --input "$compiler_input" \
            --input-role "$input_role" \
            --qbe "${{ steps.qbe.outputs.path }}" \
            --cc /usr/bin/cc \
            --profile "${{ matrix.profile }}" \
            --runner-image "${{ matrix.runner }}" \
            --workspace "$RUNNER_TEMP/bootstrap-workspace" \
            --output "$RUNNER_TEMP/package/generated-${{ matrix.asset }}" \
            --evidence "$RUNNER_TEMP/bootstrap-evidence" \
            --metadata "$RUNNER_TEMP/package/${{ matrix.target }}.json" \
            --asset-name "${{ matrix.asset }}" \
            --repository-root "$repository_root"

      - name: Collect verification context
        if: always() && steps.chain.outcome != 'skipped'
        run: |
          cp "$RUNNER_TEMP/download-time.txt" "$RUNNER_TEMP/bootstrap-evidence/"
          cp "$RUNNER_TEMP/verification-time.txt" "$RUNNER_TEMP/bootstrap-evidence/"
          cp "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/bootstrap-evidence/"
          cp "$RUNNER_TEMP/compiler-attestation.json" "$RUNNER_TEMP/bootstrap-evidence/"
          cp "$RUNNER_TEMP/manifest-attestation.json" "$RUNNER_TEMP/bootstrap-evidence/"
          cp "$RUNNER_TEMP/checksums-attestation.json" "$RUNNER_TEMP/bootstrap-evidence/"
          if test -f "$RUNNER_TEMP/package/${{ matrix.target }}.json"; then
            cp "$RUNNER_TEMP/package/${{ matrix.target }}.json" "$RUNNER_TEMP/bootstrap-evidence/"
          fi
          wc -c "$RUNNER_TEMP/qbe-1.3.tar.xz" > "$RUNNER_TEMP/bootstrap-evidence/qbe-source-size.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$RUNNER_TEMP/qbe-1.3.tar.xz" > "$RUNNER_TEMP/bootstrap-evidence/qbe-source-sha256.txt"
          else
            shasum -a 256 "$RUNNER_TEMP/qbe-1.3.tar.xz" > "$RUNNER_TEMP/bootstrap-evidence/qbe-source-sha256.txt"
          fi
          {
            printf 'verification_tooling_revision=%s\n' "$GITHUB_SHA"
            printf 'compiler_source=%s\n' "${{ inputs.compiler_source }}"
            printf 'seed_source_revision=%s\n' "$(git rev-parse HEAD)"
            if test "${{ inputs.compiler_source }}" = workflow-revision; then
              printf 'compiler_source_revision=%s\n' "$(git -C .bootstrap-verifier rev-parse HEAD)"
            else
              printf 'compiler_source_revision=%s\n' "$(git rev-parse HEAD)"
            fi
          } > "$RUNNER_TEMP/bootstrap-evidence/verification-tooling.txt"

      - name: Upload post-publication evidence
        if: always() && steps.chain.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-published-evidence-${{ inputs.compiler_source }}-${{ matrix.target }}
          path: ${{ runner.temp }}/bootstrap-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload setup-transition evidence
        if: always() && steps.transition.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-setup-transition-${{ inputs.compiler_source }}-${{ matrix.target }}
          path: ${{ runner.temp }}/transition-evidence
          if-no-files-found: error
          retention-days: 30

  verify-combined-size:
    name: Verify combined compiler size
    needs: verify-target
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download target evidence
        uses: actions/download-artifact@v5
        with:
          pattern: bootstrap-seed-published-evidence-${{ inputs.compiler_source }}-*
          path: ${{ runner.temp }}/target-evidence

      - name: Verify the registered aggregate bound
        run: |
          darwin="$RUNNER_TEMP/target-evidence/bootstrap-seed-published-evidence-${{ inputs.compiler_source }}-darwin-arm64/darwin-arm64.json"
          linux="$RUNNER_TEMP/target-evidence/bootstrap-seed-published-evidence-${{ inputs.compiler_source }}-linux-arm64/linux-arm64.json"
          test -f "$darwin"
          test -f "$linux"
          darwin_size=$(jq -r '.size' "$darwin")
          linux_size=$(jq -r '.size' "$linux")
          test "$darwin_size" -le 310000
          test "$linux_size" -le 310000
          combined_size=$((darwin_size + linux_size))
          test "$combined_size" -le 620000
          {
            printf 'darwin_arm64_bytes=%s\n' "$darwin_size"
            printf 'linux_arm64_bytes=%s\n' "$linux_size"
            printf 'combined_bytes=%s\n' "$combined_size"
          } | tee "$RUNNER_TEMP/combined-size.txt"

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-published-evidence-${{ inputs.compiler_source }}-aggregate
          path: ${{ runner.temp }}/combined-size.txt
          if-no-files-found: error
          retention-days: 30
