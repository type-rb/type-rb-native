name: Capability map Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capability-map-pages.yml
      - docs/capabilities/**
      - tools/capability-map-check.mjs
      - tools/benchmark-pages-data.mjs
      - tools/benchmark-pages-check.mjs
      - tools/daily-performance/**
  workflow_dispatch:
  workflow_run:
    workflows: [Daily performance snapshot]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: capability-map-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TypeRB Native
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check the capability catalog
        run: node tools/capability-map-check.mjs

      - name: Check the benchmark explorer
        run: |
          node tools/benchmark-pages-data.mjs --check
          node tools/benchmark-pages-check.mjs

      - name: Compose the latest daily data without committing generated measurements
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 tools/daily-performance/state.py restore --state "$RUNNER_TEMP/daily-state.json"
          python3 tools/daily-performance/state.py site --state "$RUNNER_TEMP/daily-state.json" \
            --output docs/capabilities/benchmarks/daily-state.json

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/capabilities

  deploy:
    # PR verification belongs to the required documentation authority. A main push
    # publishes automatically, while workflow_dispatch can redeploy the current
    # committed snapshot without rerunning any formal benchmark.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
