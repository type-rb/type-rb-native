name: Pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Issue #439: costs are observed during MIR consolidation.
  NATIVE_MIR_COST_MODE: mir-migration

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      quick: ${{ steps.plan.outputs.quick }}
      documentation: ${{ steps.plan.outputs.documentation }}
      memory: ${{ steps.plan.outputs.memory }}
      performance: ${{ steps.plan.outputs.performance }}
      draft: ${{ steps.plan.outputs.draft }}
      tooling: ${{ steps.plan.outputs.tooling }}
      cli: ${{ steps.plan.outputs.cli }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test routing and fail-closed acceptance
        run: node --test tools/ci-plan-test.mjs tools/ci-run-suites-test.mjs tools/recovery-workspace-test.mjs
      - name: Classify every changed path
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          git diff --check "$BASE_SHA...$HEAD_SHA"
          node tools/ci-plan.mjs "$BASE_SHA" "$HEAD_SHA" "$IS_DRAFT" >> "$GITHUB_OUTPUT"

  quick:
    needs: plan
    if: needs.plan.outputs.quick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate every reference checkout before toolchain setup
        run: |
          python3 -m unittest tools/compatibility_manifest_test.py
          python3 tools/compatibility_manifest.py
      - uses: actions/checkout@v5
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        with:
          repository: type-rb/type-rb
          ref: 27a6bdd882084d5660fc9090006eb7e2a44d706c
          path: .type-rb
      - uses: actions/setup-go@v6
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        with:
          go-version-file: .type-rb/go.mod
          cache-dependency-path: .type-rb/go.sum
      - name: Build the pinned reference compiler
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          test "$(cat TYPE_RB_REVISION)" = "$(git -C .type-rb rev-parse HEAD)"
          go build -C .type-rb -o "$RUNNER_TEMP/trb" ./cmd/trb
      - name: Check canonical compatibility metadata before matrix fan-out
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 -m unittest tools/compatibility_manifest_test.py
          python3 tools/compatibility_manifest.py --reference-trb "$RUNNER_TEMP/trb"
      - name: Check formatting and core types
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          "$RUNNER_TEMP/trb" fmt --check src compiler corpus tools benchmarks
          "$RUNNER_TEMP/trb" check --config trbconfig.reference.jsonc
          "$RUNNER_TEMP/trb" check --config compiler/trbconfig.jsonc
          tools/check-native-cli.sh "$RUNNER_TEMP/trb"
      - name: Verify project and transition policy tooling on Linux
        run: |
          sh tools/native-mir-transition-policy-test.sh
          sh tools/compiler-cost-test.sh
          sh tools/compiler-project-test.sh
      # Reference validity belongs to this oracle job, not the Go-free CLI chain.
      - name: Verify language fixtures against the exact reference compiler
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 tools/native-language-coverage-test.py
          python3 tools/native-language-coverage.py --reference "$RUNNER_TEMP/trb" \
            > "$RUNNER_TEMP/reference-language.json"
      - name: Retain reference language observations
        if: always() && (needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: reference-language
          path: ${{ runner.temp }}/reference-language.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check that the coverage table matches the fixture registry
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 tools/native-language-coverage.py --check-table docs/native-language-coverage-matrix.md
      - name: Run root units and focused MIR correctness tests
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        env:
          TYPE_RB_NATIVE_ROOT: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/trb" test --config trbconfig.reference.jsonc
          "$RUNNER_TEMP/trb" test --config compiler/trbconfig.jsonc \
            -t 'MIR|Array|Integer|Float|scalar|bounds|allocating|induction|Boolean|syntax|Hash'

  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    uses: ./.github/workflows/documentation.yml

  tooling:
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    uses: ./.github/workflows/ci-tooling.yml

  cli:
    needs: [plan, quick]
    if: needs.plan.outputs.cli == 'true'
    uses: ./.github/workflows/native-cli.yml

  native:
    needs: [plan, quick]
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.draft == 'false'
    uses: ./.github/workflows/gate-zero.yml
    with:
      cost_mode: mir-migration

  targets:
    needs: [plan, quick]
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.draft == 'false'
    uses: ./.github/workflows/gate6n-linux-amd64.yml
    with:
      cost_mode: mir-migration

  memory:
    needs: [plan, quick]
    if: needs.plan.outputs.memory == 'true' && needs.plan.outputs.draft == 'false'
    uses: ./.github/workflows/runtime-worker-memory.yml
    with:
      cost_mode: mir-migration

  performance:
    needs: [plan, native, targets, memory, tooling, cli]
    if: >-
      !cancelled() && needs.plan.outputs.performance == 'true' &&
      needs.plan.outputs.draft == 'false' && needs.native.result == 'success' &&
      needs.targets.result == 'success' && needs.memory.result == 'success' &&
      needs.tooling.result == 'success' && needs.cli.result == 'success'
    uses: ./.github/workflows/static-string-compactness.yml

  acceptance:
    name: Native CI acceptance
    if: always()
    needs: [plan, quick, documentation, native, targets, memory, performance, tooling, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require all applicable authorities, not skipped-job success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mjs accept
