name: Pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Issue #439: costs are observed during MIR consolidation.
  NATIVE_MIR_COST_MODE: mir-migration
  # Alpha development: ordinary compiler edits merge after the pre-merge lanes;
  # Main validation runs the complete lanes. Use `complete` to restore them here.
  NATIVE_CI_GATE: tiered

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      quick: ${{ steps.plan.outputs.quick }}
      compiler_units: ${{ steps.plan.outputs.compiler_units }}
      documentation: ${{ steps.plan.outputs.documentation }}
      memory: ${{ steps.plan.outputs.memory }}
      draft: ${{ steps.plan.outputs.draft }}
      tooling: ${{ steps.plan.outputs.tooling }}
      cli: ${{ steps.plan.outputs.cli }}
      complete: ${{ steps.plan.outputs.complete }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test routing and fail-closed acceptance
        run: node --test tools/ci-plan-test.mjs tools/ci-run-suites-test.mjs tools/recovery-workspace-test.mjs
      - name: Classify every changed path
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          git diff --check "$BASE_SHA...$HEAD_SHA"
          node tools/ci-plan.mjs "$BASE_SHA" "$HEAD_SHA" "$IS_DRAFT" >> "$GITHUB_OUTPUT"

  quick:
    needs: plan
    if: needs.plan.outputs.quick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check generated recovery import boundaries
        run: |
          python3 tools/recovery_layout_sync_test.py
          python3 tools/recovery_layout_sync.py --check
      - name: Validate every reference checkout before toolchain setup
        run: |
          python3 tools/build-reference-test.py
          python3 -m unittest tools/compatibility_manifest_test.py
          python3 tools/compatibility_manifest.py
      - uses: actions/checkout@v5
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        with:
          repository: type-rb/type-rb
          ref: 0504b5a735328f0c665c70f3cad2876baf3839f6
          path: .type-rb
      - uses: actions/setup-go@v6
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        with:
          go-version-file: .type-rb/go.mod
          cache-dependency-path: .type-rb/go.sum
      - name: Build the pinned reference compiler
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          test "$(cat TYPE_RB_REVISION)" = "$(git -C .type-rb rev-parse HEAD)"
          python3 tools/build-reference.py .type-rb "$RUNNER_TEMP/trb"
      - name: Check canonical compatibility metadata before matrix fan-out
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 -m unittest tools/compatibility_manifest_test.py
          python3 tools/compatibility_manifest.py --reference-trb "$RUNNER_TEMP/trb"
      - name: Check formatting and core types
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 tools/unicode-identifier-data.py --check
          python3 tools/unicode-case-data.py --check
          "$RUNNER_TEMP/trb" fmt --check src compiler corpus tools benchmarks
          "$RUNNER_TEMP/trb" check --config trbconfig.reference.jsonc
          "$RUNNER_TEMP/trb" check --config compiler/trbconfig.jsonc
          tools/check-native-cli.sh "$RUNNER_TEMP/trb"
      - name: Check the Native compiler closure against snapshot v4
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: tools/check-bootstrap-snapshot.sh "$RUNNER_TEMP/trb"
      - name: Verify project and cost tooling on Linux
        run: |
          sh tools/compiler-cost-test.sh
          sh tools/compiler-project-test.sh
      # Reference validity belongs to this oracle job, not the Go-free CLI chain.
      - name: Verify language fixtures against the exact reference compiler
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 tools/native-language-coverage-test.py
          python3 tools/native-language-coverage.py --reference "$RUNNER_TEMP/trb" \
            --reference-ast .type-rb/internal/ast/ast.go --jobs 2 \
            > "$RUNNER_TEMP/reference-language.json"
      - name: Retain reference language observations
        if: always() && (needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: reference-language
          path: ${{ runner.temp }}/reference-language.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check that the coverage views match the fixture registry
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        run: |
          python3 tools/native-language-coverage.py --check-feature-table docs/native-language-feature-inventory.md
          python3 tools/native-language-coverage.py --check-pages-data docs/capabilities/ordinary-language.js
      - name: Run root units and focused MIR correctness tests
        if: needs.plan.outputs.code == 'true' || needs.plan.outputs.cli == 'true'
        env:
          TYPE_RB_NATIVE_ROOT: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/trb" test --config trbconfig.reference.jsonc
          "$RUNNER_TEMP/trb" test --config compiler/trbconfig.jsonc \
            -t 'MIR|Array|Integer|Float|scalar|bounds|allocating|induction|Boolean|syntax|Hash'

  compiler_units:
    name: Complete compiler units
    needs: plan
    if: needs.plan.outputs.compiler_units == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: type-rb/type-rb
          ref: 0504b5a735328f0c665c70f3cad2876baf3839f6
          path: .type-rb
      - uses: actions/setup-go@v6
        with:
          go-version-file: .type-rb/go.mod
          cache-dependency-path: .type-rb/go.sum
      - name: Build the exact reference compiler
        run: |
          test "$(cat TYPE_RB_REVISION)" = "$(git -C .type-rb rev-parse HEAD)"
          python3 tools/build-reference.py .type-rb "$RUNNER_TEMP/trb"
      - name: Build pinned QBE 1.3
        run: |
          curl --fail --location --retry 3 https://c9x.me/compile/release/qbe-1.3.tar.xz -o "$RUNNER_TEMP/qbe-1.3.tar.xz"
          echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  $RUNNER_TEMP/qbe-1.3.tar.xz" | shasum -a 256 -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-1.3.tar.xz"
          make -C "$RUNNER_TEMP/qbe-1.3"
      - name: Run every compiler unit without recovery
        env:
          TYPE_RB_NATIVE_ROOT: ${{ github.workspace }}
          TYPE_RB_NATIVE_QBE: ${{ runner.temp }}/qbe-1.3/qbe
        run: |
          set +e
          started=$(date +%s)
          "$RUNNER_TEMP/trb" test --config compiler/trbconfig.jsonc --compile \
            --outfile "$RUNNER_TEMP/compiler-units" > "$RUNNER_TEMP/compiler-units.log" 2>&1
          result=$?
          compiled=$(date +%s)
          if [ "$result" -eq 0 ]; then
            python3 tools/complete_compiler_units.py \
              --root "$GITHUB_WORKSPACE" --binary "$RUNNER_TEMP/compiler-units" \
              --scratch "$RUNNER_TEMP" --jobs 2 >> "$RUNNER_TEMP/compiler-units.log" 2>&1
            result=$?
          fi
          finished=$(date +%s)
          cat "$RUNNER_TEMP/compiler-units.log"
          printf 'compile_seconds=%s\nexecution_seconds=%s\nelapsed_seconds=%s\nexit_status=%s\n' \
            "$((compiled - started))" "$((finished - compiled))" "$((finished - started))" "$result" | tee "$RUNNER_TEMP/compiler-units.status"
          exit "$result"
      - name: Retain complete compiler unit output and elapsed time
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-units-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compiler-units.log
            ${{ runner.temp }}/compiler-units.status
          if-no-files-found: warn
          retention-days: 30

  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    uses: ./.github/workflows/documentation.yml

  tooling:
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    uses: ./.github/workflows/ci-tooling.yml

  cli:
    needs: plan
    if: needs.plan.outputs.cli == 'true' && needs.plan.outputs.draft == 'false'
    uses: ./.github/workflows/native-cli.yml
    with:
      scope: ${{ needs.plan.outputs.complete == 'true' && 'complete' || 'pull-request' }}

  native:
    needs: plan
    if: >-
      needs.plan.outputs.code == 'true' && needs.plan.outputs.draft == 'false' &&
      needs.plan.outputs.complete == 'true'
    uses: ./.github/workflows/native-validation.yml
    with:
      cost_mode: mir-migration

  targets:
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.draft == 'false'
    uses: ./.github/workflows/linux-amd64-targets.yml
    with:
      cost_mode: mir-migration
      scope: ${{ needs.plan.outputs.complete == 'true' && 'complete' || 'pull-request' }}

  memory:
    needs: plan
    if: needs.plan.outputs.memory == 'true' && needs.plan.outputs.draft == 'false'
    uses: ./.github/workflows/runtime-worker-memory.yml
    with:
      cost_mode: mir-migration

  acceptance:
    name: Native CI acceptance
    if: always()
    needs: [plan, quick, compiler_units, documentation, native, targets, memory, tooling, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require all applicable authorities, not skipped-job success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mjs accept
