name: Hash probe classification measurement

on:
  push:
    branches: [fix/hash-probe-measurement]
    paths: [tools/hash-probe-evaluation/registration.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: hash-probe-evaluation-task-1088
  cancel-in-progress: false

env:
  GOFLAGS: -trimpath

jobs:
  measure:
    # A failed cohort is evidence, not an invitation to rerun for a pass.
    if: github.ref == 'refs/heads/fix/hash-probe-measurement' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[run-hash-probe-cohort]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate the registered candidate and accepted sources before preparation
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/hash-probe-evaluation/qualify.py select --output "$RUNNER_TEMP/selection.json"
          gh api repos/type-rb/type-rb-native/actions/runs/0 > "$RUNNER_TEMP/production-validation.json"
          gh api repos/type-rb/type-rb-native/actions/runs/0 > "$RUNNER_TEMP/complete-validation.json"
          gh api 'repos/type-rb/type-rb-native/actions/runs/0/jobs?per_page=100' > "$RUNNER_TEMP/complete-jobs.json"
          jq -n --slurpfile production "$RUNNER_TEMP/production-validation.json" \
            --slurpfile complete "$RUNNER_TEMP/complete-validation.json" \
            --slurpfile jobs "$RUNNER_TEMP/complete-jobs.json" \
            '{production:$production[0],complete:$complete[0],completeJobs:$jobs[0]}' > "$RUNNER_TEMP/pr-validation.json"
          python3 tools/hash-probe-evaluation/qualify.py validate-ci --run "$RUNNER_TEMP/pr-validation.json"
          python3 - "$RUNNER_TEMP/selection.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          selection = json.load(open(sys.argv[1]))
          print('candidate=' + selection['roles']['native'])
          print('comparison=' + selection['roles']['previous'])
          PY

      - name: Check out the exact registered candidate source
        env:
          CANDIDATE: ${{ steps.sources.outputs.candidate }}
        run: git worktree add --detach "$RUNNER_TEMP/qualification-source" "$CANDIDATE"

      - name: Resolve the identical pinned reference compiler
        id: reference
        run: echo "revision=$(cat TYPE_RB_REVISION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: type-rb/type-rb
          ref: ${{ steps.reference.outputs.revision }}
          path: .type-rb

      - uses: actions/setup-go@v6
        with:
          go-version-file: .type-rb/go.mod
          cache-dependency-path: .type-rb/go.sum

      - name: Prepare the unchanged daily toolchain and published seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld jq strace time
          test "$(git -C .type-rb rev-parse HEAD)" = "$(cat TYPE_RB_REVISION)"
          python3 tools/build-reference.py .type-rb "$RUNNER_TEMP/trb" --trimpath
          python3 tools/qbe_toolchain.py "$RUNNER_TEMP/qbe-1.3"
          /bin/sh tools/bootstrap-seed-download.sh bootstrap-seed-2026-09-29-module-cycles \
            04993b6bf598356a51143edd9dbde1a024c403cc \
            type-rb-native-bootstrap-linux-arm64 "$RUNNER_TEMP/release"
          /bin/sh tools/bootstrap-seed-download.sh bootstrap-seed-2026-09-09-record-arrays \
            db48f64f6c3f6ce3fb904b2d28c95fa46522ebfc \
            type-rb-native-bootstrap-linux-arm64 "$RUNNER_TEMP/baseline-release"

      - name: Close the candidate, accepted and frozen ordinary compiler chains
        working-directory: ${{ runner.temp }}/qualification-source
        env:
          NATIVE_MIR_COST_MODE: mir-migration
          COMPARISON: ${{ steps.sources.outputs.comparison }}
        run: |
          /bin/sh tools/daily-performance/prepare-compilers.sh \
            "$RUNNER_TEMP/release/type-rb-native-bootstrap-linux-arm64" \
            "$RUNNER_TEMP/qbe-1.3/qbe" "$COMPARISON" "$RUNNER_TEMP/compilers" \
            --baseline-seed "$RUNNER_TEMP/baseline-release/type-rb-native-bootstrap-linux-arm64"

      - name: Require untimed same-source correctness and repeated build identities
        run: |
          python3 tools/hash-probe-evaluation/readiness.py \
            --compilers "$RUNNER_TEMP/compilers/compilers.json" --qbe "$RUNNER_TEMP/qbe-1.3/qbe" \
            --output "$RUNNER_TEMP/readiness"

      - name: Run the unchanged daily measurement controller once
        working-directory: ${{ runner.temp }}/qualification-source
        run: |
          sudo swapoff -a
          python3 "$GITHUB_WORKSPACE/tools/hash-probe-evaluation/guarded_measure.py" \
            --source-root "$RUNNER_TEMP/qualification-source" \
            --compilers "$RUNNER_TEMP/compilers/compilers.json" --qbe "$RUNNER_TEMP/qbe-1.3/qbe" \
            --evidence "$RUNNER_TEMP/measurements" --output "$RUNNER_TEMP/snapshot.json"

      - name: Measure eight matched same-input compiler build observations
        run: |
          python3 tools/hash-probe-evaluation/compiler_cost.py \
            --compilers "$RUNNER_TEMP/compilers/compilers.json" --qbe "$RUNNER_TEMP/qbe-1.3/qbe" \
            --output "$RUNNER_TEMP/compiler-cost"

      - name: Assess the registered budget, identities and registered trade gates
        if: always() && steps.sources.outcome == 'success'
        run: |
          python3 tools/hash-probe-evaluation/qualify.py assess \
            --selection "$RUNNER_TEMP/selection.json" --snapshot "$RUNNER_TEMP/snapshot.json" \
            --raw "$RUNNER_TEMP/measurements/raw.json" \
            --readiness "$RUNNER_TEMP/readiness/readiness.json" \
            --compiler-cost "$RUNNER_TEMP/compiler-cost/compiler-cost.json" --output "$RUNNER_TEMP/qualification.json"

      - name: Retain qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hash-probe-evidence
          path: |
            ${{ runner.temp }}/readiness
            ${{ runner.temp }}/compiler-cost
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/pr-validation.json
            ${{ runner.temp }}/qualification.json
            ${{ runner.temp }}/snapshot.json
            ${{ runner.temp }}/measurements
            ${{ runner.temp }}/compilers/compilers.json
            ${{ runner.temp }}/compilers/*/evidence
            ${{ runner.temp }}/compilers/*/metadata.json
            ${{ runner.temp }}/compilers/*/*.trace
            ${{ runner.temp }}/compilers/*/*.stdout
            ${{ runner.temp }}/compilers/*/*.stderr
            ${{ runner.temp }}/compilers/*/seed-input.json
            ${{ runner.temp }}/qbe-1.3/build-info.json
            ${{ runner.temp }}/qbe-1.3/qbe
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/baseline-release/*.json
          retention-days: 90
          if-no-files-found: warn
