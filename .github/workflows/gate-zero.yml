name: Native gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out TypeRB Native
        uses: actions/checkout@v5

      - name: Check out the pinned TypeRB compiler
        uses: actions/checkout@v5
        with:
          repository: type-rb/type-rb
          ref: 2cf63e95b4fc1a92f6094e2c89c47fb75262adae
          path: .type-rb

      - name: Set up Go for the bootstrap compiler
        uses: actions/setup-go@v6
        with:
          go-version-file: .type-rb/go.mod
          cache-dependency-path: .type-rb/go.sum

      - name: Verify the compiler revision pin
        run: test "$(cat TYPE_RB_REVISION)" = "$(git -C .type-rb rev-parse HEAD)"

      - name: Build the pinned TypeRB compiler
        working-directory: .type-rb
        run: go build -o "$RUNNER_TEMP/trb" ./cmd/trb

      - name: Verify Native version and compatibility metadata
        run: |
          python3 -m unittest tools/compatibility_manifest_test.py
          python3 tools/compatibility_manifest.py --reference-trb "$RUNNER_TEMP/trb"

      - name: Build pinned QBE 1.3
        run: |
          curl -L https://c9x.me/compile/release/qbe-1.3.tar.xz -o "$RUNNER_TEMP/qbe-1.3.tar.xz"
          echo "d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320  $RUNNER_TEMP/qbe-1.3.tar.xz" | shasum -a 256 -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-1.3.tar.xz"
          make -C "$RUNNER_TEMP/qbe-1.3"

      - name: Verify formatting
        run: |
          "$RUNNER_TEMP/trb" fmt --check src compiler corpus tools benchmarks

      - name: Verify bootstrap seed tooling
        run: |
          /bin/sh -n tools/bootstrap-seed.sh
          /bin/sh -n tools/bootstrap-seed-manifest.sh
          /bin/sh -n tools/bootstrap-seed-manifest-test.sh
          /bin/sh -n tools/gate6m-linux.sh
          /bin/sh -n tools/benchmarksgame-context-verify.sh
          /bin/sh -n tools/benchmarksgame-formal/cache-control-linux.sh
          /bin/sh -n tools/benchmarksgame-formal/delegate-cpuset-linux.sh
          /bin/sh -n tools/benchmarksgame-formal/prepare-runtime.sh
          /bin/sh -n tools/benchmarksgame-formal/runtime-controller.sh
          /bin/sh -n tools/benchmarksgame-formal/runtime-controller-test.sh
          /bin/sh -n tools/runtime-memory-soak/analyze-rss-test.sh
          /bin/sh -n tools/runtime-memory-soak/runtime-memory-soak.sh
          /bin/sh -n tools/benchmarksgame-verify.sh
          /bin/sh tools/bootstrap-seed-manifest-test.sh
          /bin/sh tools/benchmarksgame-formal/runtime-controller-test.sh
          /bin/sh tools/runtime-memory-soak/analyze-rss-test.sh

      - name: Check TypeRB sources
        run: |
          "$RUNNER_TEMP/trb" check
          "$RUNNER_TEMP/trb" check --config tools/gate1-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate2-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate3-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate4-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate5-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6a-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6b-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6c-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6d-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6e-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6f-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6g-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6h-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6i-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6j-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6k-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config tools/gate6m-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" check --config compiler/gate4/trbconfig.jsonc
          for config in corpus/gate1/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in corpus/gate2/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in corpus/gate3/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in corpus/gate6i/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in corpus/gate6j/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in corpus/gate6k/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in corpus/gate6m/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done
          for config in benchmarks/benchmarksgame/*/trbconfig.jsonc; do
            "$RUNNER_TEMP/trb" check --config "$config"
          done

      - name: Run gate tests, fixtures, and source differential corpus
        env:
          TYPE_RB_NATIVE_ROOT: ${{ github.workspace }}
          TYPE_RB_NATIVE_REFERENCE_TRB: ${{ runner.temp }}/trb
          TYPE_RB_NATIVE_QBE: ${{ runner.temp }}/qbe-1.3/qbe
        run: |
          "$RUNNER_TEMP/trb" test
          "$RUNNER_TEMP/trb" test --config tools/gate6f-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config tools/gate6g-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config tools/gate6h-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config tools/gate6i-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config tools/gate6j-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config tools/gate6k-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config tools/gate6m-benchmark/trbconfig.jsonc
          "$RUNNER_TEMP/trb" test --config compiler/gate4/trbconfig.jsonc

      - name: Run the self-hosted managed-runtime allocation smoke
        run: |
          /bin/sh tools/runtime-memory-soak/runtime-memory-soak.sh \
            smoke \
            /tmp/type-rb-native-gate4-bootstrap/native-chain-b4/compiler \
            "$RUNNER_TEMP/qbe-1.3/qbe" \
            /usr/bin/cc \
            darwin-arm64-v0 \
            "$RUNNER_TEMP/runtime-memory-smoke-workspace" \
            "$RUNNER_TEMP/runtime-memory-smoke-evidence"

      - name: Upload managed-runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-memory-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-memory-smoke-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Verify the identical-source language benchmark corpus
        run: |
          /bin/sh tools/benchmarksgame-verify.sh \
            --native-compiler /tmp/type-rb-native-gate4-bootstrap/native-chain-b4/compiler \
            --reference-trb "$RUNNER_TEMP/trb" \
            --qbe "$RUNNER_TEMP/qbe-1.3/qbe" \
            --cc /usr/bin/cc \
            --target darwin-arm64-v0 \
            --workspace "$RUNNER_TEMP/benchmarksgame-verify"

      - name: Upload language benchmark verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarksgame-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmarksgame-verify
          if-no-files-found: error
          retention-days: 30

      - name: Verify the Gate 4 compiler closure fits snapshot v4
        run: |
          mkdir -p "$RUNNER_TEMP/gate4-compiler"
          cp compiler/gate4/src/compiler.trb "$RUNNER_TEMP/gate4-compiler/compiler.trb"
          cp compiler/gate4/src/storage.trb "$RUNNER_TEMP/gate4-compiler/storage.trb"
          cp compiler/gate4/src/path.trb "$RUNNER_TEMP/gate4-compiler/path.trb"
          "$RUNNER_TEMP/trb" compiler bootstrap-snapshot --snapshot-version 4 "$RUNNER_TEMP/gate4-compiler/compiler.trb" > "$RUNNER_TEMP/gate4-compiler-snapshot.json"
          test -s "$RUNNER_TEMP/gate4-compiler-snapshot.json"

      - name: Verify the Go-free Gate 4 bootstrap harness
        run: |
          /bin/sh tools/gate4-bootstrap.sh \
            /tmp/type-rb-native-gate4-bootstrap/b1 \
            /tmp/type-rb-native-gate4-bootstrap/compiler-recovery.trb \
            "$RUNNER_TEMP/qbe-1.3/qbe" \
            /usr/bin/cc \
            "$RUNNER_TEMP/gate4-shell-bootstrap" \
            b2
          cmp /tmp/type-rb-native-gate4-bootstrap/b2.ssa "$RUNNER_TEMP/gate4-shell-bootstrap/b2.ssa"
