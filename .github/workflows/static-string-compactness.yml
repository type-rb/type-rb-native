name: Static String compactness regression

on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Exact baseline revision for a manual regression run
        required: true
        default: 00009fa304a36b9cba70b123120a469347b3882d
        type: string
  workflow_call:

permissions:
  contents: read

env:
  RELEASE_TAG: bootstrap-seed-2026-08-30
  QBE_VERSION: "1.3"
  QBE_ARCHIVE_SHA256: d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320

jobs:
  compare-target:
    name: Compare ${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            profile: darwin-arm64-v0
            target: darwin-arm64
            asset: type-rb-native-bootstrap-darwin-arm64
            seed_sha256: ef438d13598c534766334b408a39715c56ff1b69db528910ebf7d90ec7720b65
          - runner: ubuntu-24.04-arm
            profile: linux-arm64-v0
            target: linux-arm64
            asset: type-rb-native-bootstrap-linux-arm64
            seed_sha256: b4307c244edc9e4da620f2a7c1b03a733e575da032efefae615f9edf75048a37
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize the registered current-main baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_BASELINE: ${{ inputs.baseline_revision }}
        run: |
          if test "$EVENT_NAME" = pull_request; then
            BASELINE_REVISION=$PULL_REQUEST_BASE
          else
            BASELINE_REVISION=$INPUT_BASELINE
          fi
          test -n "$BASELINE_REVISION"
          printf 'BASELINE_REVISION=%s\n' "$BASELINE_REVISION" >> "$GITHUB_ENV"
          git cat-file -e "$BASELINE_REVISION^{commit}"
          git merge-base --is-ancestor "$BASELINE_REVISION" HEAD
          git worktree add --detach "$RUNNER_TEMP/baseline-source" "$BASELINE_REVISION"
          test "$(git -C "$RUNNER_TEMP/baseline-source" rev-parse HEAD)" = "$BASELINE_REVISION"

      - name: Install the Linux linker and process tracer
        if: matrix.profile == 'linux-arm64-v0'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld strace

      - name: Build pinned QBE 1.3
        id: qbe
        run: |
          curl -L "https://c9x.me/compile/release/qbe-$QBE_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$QBE_ARCHIVE_SHA256  $RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz" | sha256sum -c -
          else
            echo "$QBE_ARCHIVE_SHA256  $RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz" | shasum -a 256 -c -
          fi
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-$QBE_VERSION.tar.xz"
          make -C "$RUNNER_TEMP/qbe-$QBE_VERSION"
          echo "path=$RUNNER_TEMP/qbe-$QBE_VERSION/qbe" >> "$GITHUB_OUTPUT"

      - name: Download and verify the immutable Native seed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ASSET: ${{ matrix.asset }}
          TARGET_SHA256: ${{ matrix.seed_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" \
            --pattern "$TARGET_ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$TARGET_SHA256  $RUNNER_TEMP/release/$TARGET_ASSET" | sha256sum -c -
          else
            echo "$TARGET_SHA256  $RUNNER_TEMP/release/$TARGET_ASSET" | shasum -a 256 -c -
          fi
          chmod 0755 "$RUNNER_TEMP/release/$TARGET_ASSET"

      - name: Build setup-only A/B transitions
        env:
          QBE: ${{ steps.qbe.outputs.path }}
          PROFILE: ${{ matrix.profile }}
          TARGET_ASSET: ${{ matrix.asset }}
        run: |
          seed="$RUNNER_TEMP/release/$TARGET_ASSET"
          for role in baseline candidate; do
            if test "$role" = baseline; then
              source_root="$RUNNER_TEMP/baseline-source"
            else
              source_root="$GITHUB_WORKSPACE"
            fi
            transition="$RUNNER_TEMP/$role-transition"
            mkdir -p "$transition/first" "$transition/current"
            "$seed" build "$source_root/compiler/gate4/src/compiler.trb" \
              --output "$transition/first/compiler" \
              --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
            "$transition/first/compiler" build "$source_root/compiler/gate4/src/compiler.trb" \
              --output "$transition/current/compiler" \
              --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
          done

      - name: Close exact measured A/B chains
        env:
          QBE: ${{ steps.qbe.outputs.path }}
          PROFILE: ${{ matrix.profile }}
        run: |
          /bin/sh "$RUNNER_TEMP/baseline-source/tools/bootstrap-seed.sh" \
            --mode previous \
            --input "$RUNNER_TEMP/baseline-transition/current/compiler" \
            --input-role transition \
            --qbe "$QBE" \
            --cc /usr/bin/cc \
            --profile "$PROFILE" \
            --runner-image "${{ matrix.runner }}" \
            --workspace "$RUNNER_TEMP/baseline-bootstrap-workspace" \
            --output "$RUNNER_TEMP/baseline-compiler" \
            --evidence "$RUNNER_TEMP/baseline-bootstrap-evidence" \
            --metadata "$RUNNER_TEMP/baseline-bootstrap-metadata.json" \
            --asset-name static-string-compactness-baseline \
            --repository-root "$RUNNER_TEMP/baseline-source"

          /bin/sh tools/bootstrap-seed.sh \
            --mode previous \
            --input "$RUNNER_TEMP/candidate-transition/current/compiler" \
            --input-role transition \
            --qbe "$QBE" \
            --cc /usr/bin/cc \
            --profile "$PROFILE" \
            --runner-image "${{ matrix.runner }}" \
            --workspace "$RUNNER_TEMP/candidate-bootstrap-workspace" \
            --output "$RUNNER_TEMP/candidate-compiler" \
            --evidence "$RUNNER_TEMP/candidate-bootstrap-evidence" \
            --metadata "$RUNNER_TEMP/candidate-bootstrap-metadata.json" \
            --asset-name static-string-compactness-candidate

      - name: Enforce compiler size and build-cost bounds
        env:
          PROFILE: ${{ matrix.profile }}
          QBE: ${{ steps.qbe.outputs.path }}
          TARGET: ${{ matrix.target }}
        run: |
          . tools/native-mir-transition-policy.sh
          native_mir_transition_markers_valid "$GITHUB_WORKSPACE"
          evidence="$RUNNER_TEMP/comparison-evidence"
          observations="$evidence/interleaved-measurements.csv"
          compiler_limit=$(native_mir_target_compiler_limit "$PROFILE")
          compiler_ratio_limit=$(native_mir_compiler_ratio_limit \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source")
          build_ratio_limit=$(native_mir_build_ratio_limit \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source")
          policy_mode=$(native_mir_transition_mode \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source")
          induction_phi_recovery=0
          if native_mir_induction_phi_recovery \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            induction_phi_recovery=1
          fi
          array_reduction_transition=0
          if native_mir_array_reduction_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            array_reduction_transition=1
          fi
          array_loop_recovery=0
          if native_mir_array_loop_recovery_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            array_loop_recovery=1
          fi
          float_array_reduction=0
          if native_mir_float_array_reduction_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            float_array_reduction=1
          fi
          guarded_multiply=0
          if native_mir_guarded_multiply_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            guarded_multiply=1
          fi
          guarded_add=0
          if native_mir_guarded_add_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            guarded_add=1
          fi
          stable_array_header=0
          if native_mir_stable_array_header_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            stable_array_header=1
          fi
          mkdir -p "$evidence" "$RUNNER_TEMP/interleaved-builds"
          printf 'metric\tstage\tbaseline\tcandidate\tcandidate_baseline_ratio\tmaximum\tstatus\n' \
            > "$evidence/comparison.tsv"
          printf 'phase,round,order,role,stage,elapsed_seconds,peak_rss_bytes,status\n' \
            > "$observations"
          printf 'metric\tstage\trole\tbaseline_median\tmaximum_observation\tratio\tmaximum\tstatus\n' \
            > "$evidence/catastrophic.tsv"
          {
            printf 'decision_series=two-warmup-seven-retained-interleaved-a-b\n'
            printf 'first_position=alternates-each-round\n'
            printf 'bootstrap_series=closure-evidence-only\n'
            printf 'fixed_point_adjacencies=pooled-b2-b3-and-b3-b4-byte-identical-builds\n'
            printf 'native_mir_policy_mode=%s\n' "$policy_mode"
            printf 'induction_phi_recovery=%s\n' "$induction_phi_recovery"
            printf 'array_reduction_transition=%s\n' "$array_reduction_transition"
            printf 'array_loop_recovery=%s\n' "$array_loop_recovery"
            printf 'float_array_reduction=%s\n' "$float_array_reduction"
            printf 'guarded_multiply=%s\n' "$guarded_multiply"
            printf 'guarded_add=%s\n' "$guarded_add"
            printf 'stable_array_header=%s\n' "$stable_array_header"
            printf 'compiler_ratio_limit=%s\n' "$compiler_ratio_limit"
            printf 'build_ratio_limit=%s\n' "$build_ratio_limit"
            printf 'rss_ratio_limit=%s\n' "$NATIVE_MIR_RSS_RATIO_LIMIT"
            printf 'catastrophic_ratio_limit=%s\n' "$NATIVE_MIR_CATASTROPHIC_RATIO_LIMIT"
          } > "$evidence/measurement-policy.txt"

          observe() {
            phase=$1
            round=$2
            order=$3
            role=$4
            stage=$5
            case "$role" in
              baseline)
                source_root="$RUNNER_TEMP/baseline-source"
                ;;
              candidate)
                source_root="$GITHUB_WORKSPACE"
                ;;
            esac
            case "$stage" in
              b2-b3)
                seed="$RUNNER_TEMP/$role-bootstrap-workspace/b2/compiler"
                expected="$RUNNER_TEMP/$role-bootstrap-workspace/b3/compiler"
                ;;
              b3-b4)
                seed="$RUNNER_TEMP/$role-bootstrap-workspace/b3/compiler"
                expected="$RUNNER_TEMP/$role-bootstrap-workspace/b4/compiler"
                ;;
            esac
            directory="$RUNNER_TEMP/interleaved-builds/$phase-$round-$stage-$role"
            mkdir -p "$directory"
            output="$directory/compiler"
            stdout="$directory/stdout"
            stderr="$directory/stderr"
            time_log="$directory/time.txt"
            elapsed=0
            rss=0
            status=0
            if test "$TARGET" = darwin-arm64; then
              set +e
              /usr/bin/time -p -l \
                "$seed" build "$source_root/compiler/gate4/src/compiler.trb" \
                --output "$output" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE" \
                > "$stdout" 2> "$time_log"
              status=$?
              set -e
              elapsed=$(awk '$1 == "real" { print $2; exit }' "$time_log")
              rss=$(awk '/maximum resident set size/ { print $1; exit }' "$time_log")
            else
              set +e
              /usr/bin/time -f '%e %M' -o "$time_log" \
                "$seed" build "$source_root/compiler/gate4/src/compiler.trb" \
                --output "$output" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE" \
                > "$stdout" 2> "$stderr"
              status=$?
              set -e
              elapsed=$(awk '{ print $1 }' "$time_log")
              rss_kib=$(awk '{ print $2 }' "$time_log")
              case "$rss_kib" in
                '' | *[!0-9]*) rss=0 ;;
                *) rss=$((rss_kib * 1024)) ;;
              esac
              test ! -s "$stderr"
            fi
            printf '%s,%s,%s,%s,%s,%s,%s,%s\n' \
              "$phase" "$round" "$order" "$role" "$stage" \
              "${elapsed:-0}" "${rss:-0}" "$status" >> "$observations"
            test "$status" -eq 0
            test ! -s "$stdout"
            awk -v elapsed="$elapsed" -v rss="$rss" \
              'BEGIN { exit !(elapsed > 0 && rss > 0) }'
            cmp "$expected" "$output"
          }

          run_round() {
            phase=$1
            round=$2
            if test $((round % 2)) -eq 1; then
              roles='baseline candidate'
            else
              roles='candidate baseline'
            fi
            for stage in b2-b3 b3-b4; do
              order=1
              for role in $roles; do
                observe "$phase" "$round" "$order" "$role" "$stage"
                order=$((order + 1))
              done
            done
          }

          round=1
          while test "$round" -le 2; do
            run_round warmup "$round"
            round=$((round + 1))
          done
          round=1
          while test "$round" -le 7; do
            run_round retained "$round"
            round=$((round + 1))
          done

          median() {
            role=$1
            stage=$2
            column=$3
            awk -F, -v role="$role" -v stage="$stage" -v column="$column" '
              NR > 1 && $1 == "retained" && $4 == role && $5 == stage && $8 == 0 {
                print $column
                count += 1
              }
              END { if (count != 7) exit 1 }
            ' "$observations" | LC_ALL=C sort -n | sed -n '4p'
          }

          fixed_point_median() {
            role=$1
            column=$2
            awk -F, -v role="$role" -v column="$column" '
              NR > 1 && $1 == "retained" && $4 == role && $8 == 0 {
                print $column
                count += 1
              }
              END { if (count != 14) exit 1 }
            ' "$observations" | LC_ALL=C sort -n | awk '
              { value[NR] = $1 }
              END {
                if (NR != 14) exit 1
                printf "%.6f\n", (value[7] + value[8]) / 2
              }
            '
          }

          compare() {
            name=$1
            stage=$2
            baseline=$3
            candidate=$4
            maximum=$5
            ratio=$(awk -v baseline="$baseline" -v candidate="$candidate" \
              'BEGIN { printf "%.6f", candidate / baseline }')
            status=pass
            if ! awk -v ratio="$ratio" -v maximum="$maximum" \
              'BEGIN { exit !(ratio <= maximum) }'; then
              status=fail
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$stage" "$baseline" "$candidate" "$ratio" "$maximum" "$status" \
              >> "$evidence/comparison.tsv"
            test "$status" = pass
          }

          require_below_catastrophic() {
            name=$1
            stage=$2
            role=$3
            column=$4
            baseline_median=$5
            maximum_observation=$(awk -F, -v role="$role" -v stage="$stage" -v column="$column" '
              NR > 1 && $1 == "retained" && $4 == role && $5 == stage && $8 == 0 {
                if (!found || $column > maximum) maximum = $column
                found = 1
              }
              END { if (!found) exit 1; print maximum }
            ' "$observations")
            ratio=$(awk -v baseline="$baseline_median" -v maximum="$maximum_observation" \
              'BEGIN { printf "%.6f", maximum / baseline }')
            status=pass
            if ! awk -v ratio="$ratio" -v maximum="$NATIVE_MIR_CATASTROPHIC_RATIO_LIMIT" \
              'BEGIN { exit !(ratio <= maximum) }'; then
              status=fail
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$stage" "$role" "$baseline_median" "$maximum_observation" \
              "$ratio" "$NATIVE_MIR_CATASTROPHIC_RATIO_LIMIT" "$status" \
              >> "$evidence/catastrophic.tsv"
            test "$status" = pass
          }

          baseline_size=$(wc -c < "$RUNNER_TEMP/baseline-compiler" | tr -d ' ')
          candidate_size=$(wc -c < "$RUNNER_TEMP/candidate-compiler" | tr -d ' ')
          compiler_text_size() {
            compiler=$1
            if test "$TARGET" = darwin-arm64; then
              text_hex=$(otool -l "$compiler" | awk '
                $1 == "sectname" && $2 == "__text" { text = 1; next }
                text && $1 == "size" { print $2; exit }
              ')
            else
              text_hex=$(readelf -SW "$compiler" | awk '
                $2 == ".text" { print "0x" $6; exit }
              ')
            fi
            case "$text_hex" in
              0x[0-9a-fA-F]*) printf '%d\n' "$text_hex" ;;
              *) return 1 ;;
            esac
          }
          baseline_text_size=$(compiler_text_size "$RUNNER_TEMP/baseline-compiler")
          candidate_text_size=$(compiler_text_size "$RUNNER_TEMP/candidate-compiler")
          printf 'target\tbaseline_text_bytes\tcandidate_text_bytes\tstatus\n' \
            > "$evidence/code-sections.tsv"
          text_status=observed
          if test "$stable_array_header" -eq 1; then
            text_status=pass
            text_limit=$(native_mir_target_text_limit "$PROFILE")
            if test "$candidate_text_size" -gt "$text_limit"; then
              text_status=fail
            fi
          else
            if test "$array_loop_recovery" -eq 1 || \
              test "$float_array_reduction" -eq 1 || \
              test "$guarded_multiply" -eq 1 || \
              test "$guarded_add" -eq 1; then
              text_status=pass
              text_limit=$NATIVE_MIR_ARRAY_LOOP_LINUX_TEXT_LIMIT
              if test "$TARGET" = darwin-arm64; then
                text_limit=$NATIVE_MIR_ARRAY_LOOP_DARWIN_TEXT_LIMIT
              fi
              if test "$candidate_text_size" -gt "$text_limit"; then
                text_status=fail
              fi
            else
              if test "$induction_phi_recovery" -eq 1; then
                text_status=pass
                if test "$candidate_text_size" -ge "$baseline_text_size"; then
                  text_status=fail
                fi
              else
                if test "$array_reduction_transition" -eq 1; then
                  text_status=pass
                  text_limit=$(native_mir_target_text_limit "$PROFILE")
                  if test "$candidate_text_size" -gt "$text_limit"; then
                    text_status=fail
                  fi
                fi
              fi
            fi
          fi
          printf '%s\t%s\t%s\t%s\n' \
            "$TARGET" "$baseline_text_size" "$candidate_text_size" "$text_status" \
            >> "$evidence/code-sections.tsv"
          test "$text_status" != fail
          test "$candidate_size" -le "$compiler_limit"
          if test "$induction_phi_recovery" -eq 1 || \
            test "$array_loop_recovery" -eq 1 || \
            test "$float_array_reduction" -eq 1 || \
            test "$guarded_multiply" -eq 1 || \
            test "$guarded_add" -eq 1; then
            test "$candidate_size" -le "$baseline_size"
          fi
          compare compiler_bytes fixed-point \
            "$baseline_size" "$candidate_size" "$compiler_ratio_limit"
          baseline_elapsed=$(fixed_point_median baseline 6)
          candidate_elapsed=$(fixed_point_median candidate 6)
          baseline_rss=$(fixed_point_median baseline 7)
          candidate_rss=$(fixed_point_median candidate 7)
          compare build_elapsed fixed-point-build \
            "$baseline_elapsed" "$candidate_elapsed" "$build_ratio_limit"
          compare build_peak_rss fixed-point-build \
            "$baseline_rss" "$candidate_rss" "$NATIVE_MIR_RSS_RATIO_LIMIT"
          for stage in b2-b3 b3-b4; do
            baseline_elapsed=$(median baseline "$stage" 6)
            baseline_rss=$(median baseline "$stage" 7)
            for role in baseline candidate; do
              require_below_catastrophic build_elapsed "$stage" "$role" 6 "$baseline_elapsed"
              require_below_catastrophic build_peak_rss "$stage" "$role" 7 "$baseline_rss"
            done
          done

          baseline_fixed_qbe_size=$(awk -F= '$1 == "fixed_point_qbe_size" {print $2}' \
            "$RUNNER_TEMP/baseline-bootstrap-evidence/identities.txt")
          fixed_qbe_size=$(awk -F= '$1 == "fixed_point_qbe_size" {print $2}' \
            "$RUNNER_TEMP/candidate-bootstrap-evidence/identities.txt")
          fixed_qbe_sha256=$(awk -F= '$1 == "fixed_point_qbe_sha256" {print $2}' \
            "$RUNNER_TEMP/candidate-bootstrap-evidence/identities.txt")
          if test "$stable_array_header" -eq 1; then
            test "$fixed_qbe_size" -le "$NATIVE_MIR_TARGET_NEUTRAL_QBE_LIMIT"
          else
            if test "$array_loop_recovery" -eq 1 || \
              test "$float_array_reduction" -eq 1 || \
              test "$guarded_multiply" -eq 1 || \
              test "$guarded_add" -eq 1; then
              test "$fixed_qbe_size" -le "$NATIVE_MIR_ARRAY_LOOP_QBE_LIMIT"
            else
              if test "$induction_phi_recovery" -eq 1; then
                test "$fixed_qbe_size" -lt "$baseline_fixed_qbe_size"
                test "$fixed_qbe_size" -lt 1089635
              else
                if test "$array_reduction_transition" -eq 1; then
                  test "$fixed_qbe_size" -le "$NATIVE_MIR_TARGET_NEUTRAL_QBE_LIMIT"
                fi
              fi
            fi
          fi
          {
            printf 'target=%s\n' "$TARGET"
            printf 'baseline_compiler_bytes=%s\n' "$baseline_size"
            printf 'candidate_compiler_bytes=%s\n' "$candidate_size"
            printf 'candidate_compiler_limit=%s\n' "$compiler_limit"
            printf 'baseline_text_bytes=%s\n' "$baseline_text_size"
            printf 'candidate_text_bytes=%s\n' "$candidate_text_size"
            printf 'native_mir_policy_mode=%s\n' "$policy_mode"
            printf 'induction_phi_recovery=%s\n' "$induction_phi_recovery"
            printf 'array_reduction_transition=%s\n' "$array_reduction_transition"
            printf 'array_loop_recovery=%s\n' "$array_loop_recovery"
            printf 'float_array_reduction=%s\n' "$float_array_reduction"
            printf 'guarded_multiply=%s\n' "$guarded_multiply"
            printf 'guarded_add=%s\n' "$guarded_add"
            printf 'stable_array_header=%s\n' "$stable_array_header"
            printf 'compiler_ratio_limit=%s\n' "$compiler_ratio_limit"
            printf 'build_ratio_limit=%s\n' "$build_ratio_limit"
            printf 'baseline_fixed_point_qbe_size=%s\n' "$baseline_fixed_qbe_size"
            printf 'fixed_point_qbe_size=%s\n' "$fixed_qbe_size"
            printf 'fixed_point_qbe_sha256=%s\n' "$fixed_qbe_sha256"
          } > "$evidence/identities.txt"

      - name: Verify conditional output and long-literal execution
        env:
          QBE: ${{ steps.qbe.outputs.path }}
          PROFILE: ${{ matrix.profile }}
        run: |
          evidence="$RUNNER_TEMP/application-evidence"
          workspace="$RUNNER_TEMP/applications"
          mkdir -p "$evidence" "$workspace/baseline/no-long" "$workspace/candidate/no-long"
          printf 'case\tartifact\tbaseline_bytes\tcandidate_bytes\tadded_bytes\tmaximum_added_bytes\tstatus\n' \
            > "$evidence/sizes.tsv"
          require_additive_bound() {
            case_name=$1
            artifact=$2
            baseline=$3
            candidate=$4
            maximum=$5
            added=$((candidate - baseline))
            status=pass
            if test "$added" -gt "$maximum"; then
              status=fail
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$case_name" "$artifact" "$baseline" "$candidate" "$added" "$maximum" "$status" \
              >> "$evidence/sizes.tsv"
            test "$status" = pass
          }
          short_source=compiler/gate4/conformance/valid/strings-calls.trb
          printf 'strings-ok\n' > "$workspace/no-long.expected"
          for role in baseline candidate; do
            compiler="$RUNNER_TEMP/$role-compiler"
            directory="$workspace/$role/no-long"
            "$compiler" emit-qbe "$short_source" > "$directory/program.ssa"
            "$compiler" build "$short_source" \
              --output "$directory/program" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
            "$directory/program" > "$directory/stdout" 2> "$directory/stderr"
            cmp "$workspace/no-long.expected" "$directory/stdout"
            test ! -s "$directory/stderr"
            if grep -F 'g4_static_string_decode' "$directory/program.ssa" >/dev/null; then
              printf '%s no-long-literal control emitted the decoder\n' "$role" >&2
              exit 1
            fi
          done
          baseline_short_qbe=$(wc -c < "$workspace/baseline/no-long/program.ssa" | tr -d ' ')
          candidate_short_qbe=$(wc -c < "$workspace/candidate/no-long/program.ssa" | tr -d ' ')
          baseline_short_program=$(wc -c < "$workspace/baseline/no-long/program" | tr -d ' ')
          candidate_short_program=$(wc -c < "$workspace/candidate/no-long/program" | tr -d ' ')
          require_additive_bound no-long qbe "$baseline_short_qbe" "$candidate_short_qbe" 4096
          require_additive_bound no-long executable \
            "$baseline_short_program" "$candidate_short_program" 1024

          long_source="$workspace/long-static-string.trb"
          {
            printf 'def main()\n\tvalue := "'
            index=0
            while test "$index" -lt 512; do
              printf 'abcdefghijklmnopqrstuvwxyz012345'
              index=$((index + 1))
            done
            printf '"\n\tputs(value.size().to_s())\n\treturn\nend\n'
          } > "$long_source"
          printf '16384\n' > "$workspace/long-static-string.out"

          mkdir -p "$workspace/baseline/long" "$workspace/candidate/long"
          for role in baseline candidate; do
            compiler="$RUNNER_TEMP/$role-compiler"
            directory="$workspace/$role/long"
            "$compiler" emit-qbe "$long_source" > "$directory/first.ssa"
            "$compiler" emit-qbe "$long_source" > "$directory/second.ssa"
            cmp "$directory/first.ssa" "$directory/second.ssa"
            "$compiler" build "$long_source" \
              --output "$directory/program" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
            "$directory/program" > "$directory/stdout" 2> "$directory/stderr"
            cmp "$workspace/long-static-string.out" "$directory/stdout"
            test ! -s "$directory/stderr"
          done
          for role in baseline candidate; do
            grep -F 'function $g4_static_string_decode' "$workspace/$role/long/first.ssa" >/dev/null
            grep -F 'call $g4_static_strings_initialize()' "$workspace/$role/long/first.ssa" >/dev/null
            test "$(grep -c 'call \$g4_static_string_decode' "$workspace/$role/long/first.ssa")" -eq 1
          done

          baseline_long_size=$(wc -c < "$workspace/baseline/long/program" | tr -d ' ')
          candidate_long_size=$(wc -c < "$workspace/candidate/long/program" | tr -d ' ')
          baseline_long_qbe=$(wc -c < "$workspace/baseline/long/first.ssa" | tr -d ' ')
          candidate_long_qbe=$(wc -c < "$workspace/candidate/long/first.ssa" | tr -d ' ')
          require_additive_bound long qbe "$baseline_long_qbe" "$candidate_long_qbe" 4096
          require_additive_bound long executable "$baseline_long_size" "$candidate_long_size" 1024
          if test "$PROFILE" = linux-arm64-v0; then
            readelf -W -l "$workspace/candidate/long/program" > "$evidence/executable-segments.txt"
            awk '
              $1 == "GNU_STACK" {
                count += 1
                for (field = 2; field <= NF; field += 1) {
                  if ($field ~ /^[RWE]+$/ && $field ~ /E/) executable = 1
                }
              }
              END {exit !(count == 1 && !executable)}
            ' "$evidence/executable-segments.txt"
          else
            otool -l "$workspace/candidate/long/program" > "$evidence/executable-segments.txt"
          fi

      - name: Verify the Native MIR Array-loop recovery
        env:
          QBE: ${{ steps.qbe.outputs.path }}
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
        run: |
          . tools/native-mir-transition-policy.sh
          if ! native_mir_array_loop_recovery_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            exit 0
          fi
          evidence="$RUNNER_TEMP/array-loop-recovery-evidence"
          workspace="$RUNNER_TEMP/array-loop-recovery"
          source=tools/native-mir-array-loop-recovery/workload.trb
          expected=tools/native-mir-array-loop-recovery/workload.out
          mkdir -p "$evidence" "$workspace/baseline" "$workspace/candidate"
          executable_text_size() {
            executable=$1
            if test "$TARGET" = darwin-arm64; then
              text_hex=$(otool -l "$executable" | awk '
                $1 == "sectname" && $2 == "__text" { text = 1; next }
                text && $1 == "size" { print $2; exit }
              ')
            else
              text_hex=$(readelf -SW "$executable" | awk '
                $2 == ".text" { print "0x" $6; exit }
              ')
            fi
            case "$text_hex" in
              0x[0-9a-fA-F]*) printf '%d\n' "$text_hex" ;;
              *) return 1 ;;
            esac
          }
          for role in baseline candidate; do
            compiler="$RUNNER_TEMP/$role-compiler"
            directory="$workspace/$role"
            "$compiler" emit-qbe "$source" > "$directory/program.ssa"
            "$compiler" build "$source" \
              --output "$directory/program" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
          done
          baseline_qbe=$(wc -c < "$workspace/baseline/program.ssa" | tr -d ' ')
          candidate_qbe=$(wc -c < "$workspace/candidate/program.ssa" | tr -d ' ')
          baseline_text=$(executable_text_size "$workspace/baseline/program")
          candidate_text=$(executable_text_size "$workspace/candidate/program")
          qbe_status=pass
          text_status=pass
          if test "$candidate_qbe" -ge "$baseline_qbe"; then
            qbe_status=fail
          fi
          if test "$candidate_text" -ge "$baseline_text"; then
            text_status=fail
          fi
          {
            printf 'artifact\tbaseline_bytes\tcandidate_bytes\tstatus\n'
            printf 'target-neutral-qbe\t%s\t%s\t%s\n' \
              "$baseline_qbe" "$candidate_qbe" "$qbe_status"
            printf '%s-text\t%s\t%s\t%s\n' \
              "$TARGET" "$baseline_text" "$candidate_text" "$text_status"
          } > "$evidence/code-size.tsv"
          test "$qbe_status" = pass
          test "$text_status" = pass
          python3 tools/native-mir-array-loop-recovery/measure.py \
            "$workspace/baseline/program" \
            "$workspace/candidate/program" \
            "$expected" \
            "$evidence/runtime"

      - name: Verify the Native MIR Float Array reduction
        env:
          QBE: ${{ steps.qbe.outputs.path }}
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
        run: |
          . tools/native-mir-transition-policy.sh
          if ! native_mir_float_array_reduction_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            exit 0
          fi
          evidence="$RUNNER_TEMP/float-array-reduction-evidence"
          workspace="$RUNNER_TEMP/float-array-reduction"
          mkdir -p "$evidence" "$workspace"
          printf 'workload\tartifact\tbaseline_bytes\tcandidate_bytes\tstatus\n' \
            > "$evidence/code-size.tsv"
          executable_text_size() {
            executable=$1
            if test "$TARGET" = darwin-arm64; then
              text_hex=$(otool -l "$executable" | awk '
                $1 == "sectname" && $2 == "__text" { text = 1; next }
                text && $1 == "size" { print $2; exit }
              ')
            else
              text_hex=$(readelf -SW "$executable" | awk '
                $2 == ".text" { print "0x" $6; exit }
              ')
            fi
            case "$text_hex" in
              0x[0-9a-fA-F]*) printf '%d\n' "$text_hex" ;;
              *) return 1 ;;
            esac
          }
          for workload in hot streaming; do
            case "$workload" in
              hot)
                source=tools/native-mir-float-array-reduction/workload.trb
                expected=tools/native-mir-float-array-reduction/workload.out
                runtime_limit=0.75
                ;;
              streaming)
                source=tools/native-mir-float-array-reduction/streaming.trb
                expected=tools/native-mir-float-array-reduction/streaming.out
                runtime_limit=0.90
                ;;
            esac
            for role in baseline candidate; do
              directory="$workspace/$workload/$role"
              compiler="$RUNNER_TEMP/$role-compiler"
              mkdir -p "$directory"
              "$compiler" emit-qbe "$source" > "$directory/program.ssa"
              "$compiler" build "$source" \
                --output "$directory/program" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
            done
            baseline_qbe=$(wc -c < "$workspace/$workload/baseline/program.ssa" | tr -d ' ')
            candidate_qbe=$(wc -c < "$workspace/$workload/candidate/program.ssa" | tr -d ' ')
            baseline_text=$(executable_text_size "$workspace/$workload/baseline/program")
            candidate_text=$(executable_text_size "$workspace/$workload/candidate/program")
            qbe_status=pass
            text_status=pass
            if test "$candidate_qbe" -ge "$baseline_qbe"; then
              qbe_status=fail
            fi
            if test "$candidate_text" -ge "$baseline_text"; then
              text_status=fail
            fi
            printf '%s\ttarget-neutral-qbe\t%s\t%s\t%s\n' \
              "$workload" "$baseline_qbe" "$candidate_qbe" "$qbe_status" \
              >> "$evidence/code-size.tsv"
            printf '%s\t%s-text\t%s\t%s\t%s\n' \
              "$workload" "$TARGET" "$baseline_text" "$candidate_text" "$text_status" \
              >> "$evidence/code-size.tsv"
            test "$qbe_status" = pass
            test "$text_status" = pass
            python3 tools/native-mir-array-loop-recovery/measure.py \
              "$workspace/$workload/baseline/program" \
              "$workspace/$workload/candidate/program" \
              "$expected" \
              "$evidence/$workload-runtime" \
              "$runtime_limit"
          done

          printf 'control\tbaseline_status\tcandidate_status\tstdout_status\tstderr_status\n' \
            > "$evidence/controls.tsv"
          for control in empty unsupported nonfinite; do
            source="tools/native-mir-float-array-reduction/$control.trb"
            for role in baseline candidate; do
              compiler="$RUNNER_TEMP/$role-compiler"
              "$compiler" build "$source" \
                --output "$workspace/$control-$role" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
              set +e
              "$workspace/$control-$role" \
                > "$workspace/$control-$role.stdout" \
                2> "$workspace/$control-$role.stderr"
              status=$?
              set -e
              printf '%s\n' "$status" > "$workspace/$control-$role.status"
            done
            baseline_status=$(cat "$workspace/$control-baseline.status")
            candidate_status=$(cat "$workspace/$control-candidate.status")
            cmp "$workspace/$control-baseline.stdout" "$workspace/$control-candidate.stdout"
            cmp "$workspace/$control-baseline.stderr" "$workspace/$control-candidate.stderr"
            stdout_status=pass
            stderr_status=pass
            if test "$control" = nonfinite; then
              test "$baseline_status" -eq 2
              test "$candidate_status" -eq 2
              test ! -s "$workspace/$control-baseline.stdout"
              cmp tools/native-mir-float-array-reduction/nonfinite.err \
                "$workspace/$control-baseline.stderr"
            else
              test "$baseline_status" -eq 0
              test "$candidate_status" -eq 0
              test ! -s "$workspace/$control-baseline.stderr"
              cmp "tools/native-mir-float-array-reduction/$control.out" \
                "$workspace/$control-baseline.stdout"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$control" "$baseline_status" "$candidate_status" \
              "$stdout_status" "$stderr_status" >> "$evidence/controls.tsv"
          done

      - name: Verify the selected Native MIR application optimization
        env:
          QBE: ${{ steps.qbe.outputs.path }}
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
        run: |
          . tools/native-mir-transition-policy.sh
          enforce_executable_ratio=0
          strict_selected_code=0
          stable_array_header=0
          if native_mir_stable_array_header_transition \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
            marker=$NATIVE_MIR_STABLE_ARRAY_HEADER_MARKER
            fixture=stable-array-header-mir
            evidence="$RUNNER_TEMP/stable-array-header-evidence"
            workspace="$RUNNER_TEMP/stable-array-header"
            qbe_limit=$NATIVE_MIR_STABLE_ARRAY_HEADER_QBE_LIMIT
            selected_code_limit=1.00
            selected_executable_limit=$NATIVE_MIR_STABLE_ARRAY_HEADER_SELECTED_EXECUTABLE_RATIO_LIMIT
            selected_runtime_limit=$NATIVE_MIR_STABLE_ARRAY_HEADER_SELECTED_RUNTIME_RATIO_LIMIT
            control_limit=$NATIVE_MIR_STABLE_ARRAY_HEADER_CONTROL_RATIO_LIMIT
            enforce_executable_ratio=1
            strict_selected_code=1
            stable_array_header=1
          else
            if native_mir_guarded_add_transition \
              "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
              marker=$NATIVE_MIR_GUARDED_ADD_MARKER
              fixture=integer-add-mir-guarded
              evidence="$RUNNER_TEMP/guarded-add-evidence"
              workspace="$RUNNER_TEMP/guarded-add"
              qbe_limit=$NATIVE_MIR_GUARDED_ADD_QBE_LIMIT
              selected_code_limit=$NATIVE_MIR_GUARDED_ADD_SELECTED_CODE_RATIO_LIMIT
              selected_executable_limit=$NATIVE_MIR_GUARDED_ADD_SELECTED_EXECUTABLE_RATIO_LIMIT
              selected_runtime_limit=$NATIVE_MIR_GUARDED_ADD_SELECTED_RUNTIME_RATIO_LIMIT
              control_limit=$NATIVE_MIR_GUARDED_ADD_CONTROL_RATIO_LIMIT
              enforce_executable_ratio=1
            else
              if native_mir_guarded_multiply_transition \
                "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-source"; then
                marker=$NATIVE_MIR_GUARDED_MULTIPLY_MARKER
                fixture=integer-multiply-mir-guarded
                evidence="$RUNNER_TEMP/guarded-multiply-evidence"
                workspace="$RUNNER_TEMP/guarded-multiply"
                qbe_limit=$NATIVE_MIR_GUARDED_MULTIPLY_QBE_LIMIT
                selected_code_limit=$NATIVE_MIR_GUARDED_MULTIPLY_SELECTED_CODE_RATIO_LIMIT
                selected_executable_limit=$NATIVE_MIR_GUARDED_MULTIPLY_CONTROL_RATIO_LIMIT
                selected_runtime_limit=$NATIVE_MIR_GUARDED_MULTIPLY_SELECTED_RUNTIME_RATIO_LIMIT
                control_limit=$NATIVE_MIR_GUARDED_MULTIPLY_CONTROL_RATIO_LIMIT
              else
                exit 0
              fi
            fi
          fi
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          require_registered_hash() {
            key=$1
            path=$2
            expected_hash=$(awk -F= -v key="$key" '$1 == key {print $2}' "$marker")
            test -n "$expected_hash"
            test "$(sha256_file "$path")" = "$expected_hash"
          }
          require_registered_hash compiler_source_sha256 compiler/gate4/src/compiler.trb
          require_registered_hash compiler_test_source_sha256 compiler/gate4/src/compiler_test.trb
          require_registered_hash valid_source_sha256 "compiler/gate4/conformance/valid/$fixture.trb"
          require_registered_hash valid_expected_stdout_sha256 "compiler/gate4/conformance/valid/$fixture.out"
          if test "$stable_array_header" -eq 0; then
            require_registered_hash overflow_source_sha256 "compiler/gate4/conformance/runtime-invalid/$fixture-overflow.trb"
            require_registered_hash overflow_expected_stderr_sha256 "compiler/gate4/conformance/runtime-invalid/$fixture-overflow.stderr"
          fi
          require_registered_hash measure_source_sha256 tools/native-mir-guarded-multiply/measure.py
          require_registered_hash spectral_source_sha256 benchmarks/benchmarksgame/spectral-norm/src/main.trb
          require_registered_hash spectral_expected_stdout_sha256 benchmarks/benchmarksgame/spectral-norm/expected/5500.txt
          require_registered_hash fannkuch_source_sha256 benchmarks/benchmarksgame/fannkuch-redux/src/main.trb
          require_registered_hash fannkuch_expected_stdout_sha256 benchmarks/benchmarksgame/fannkuch-redux/expected/12.txt
          require_registered_hash nbody_source_sha256 benchmarks/benchmarksgame/n-body/src/main.trb
          require_registered_hash nbody_expected_stdout_sha256 benchmarks/benchmarksgame/n-body/expected/50000000.txt
          mkdir -p "$evidence" "$workspace"
          printf 'case\tartifact\tbaseline_bytes\tcandidate_bytes\tratio\tmaximum\tstatus\n' \
            > "$evidence/code-size.tsv"

          executable_text_size() {
            executable=$1
            if test "$TARGET" = darwin-arm64; then
              text_hex=$(otool -l "$executable" | awk '
                $1 == "sectname" && $2 == "__text" { text = 1; next }
                text && $1 == "size" { print $2; exit }
              ')
            else
              text_hex=$(readelf -SW "$executable" | awk '
                $2 == ".text" { print "0x" $6; exit }
              ')
            fi
            case "$text_hex" in
              0x[0-9a-fA-F]*) printf '%d\n' "$text_hex" ;;
              *) return 1 ;;
            esac
          }

          compare_ratio() {
            case_name=$1
            artifact=$2
            baseline=$3
            candidate=$4
            maximum=$5
            ratio=$(awk -v baseline="$baseline" -v candidate="$candidate" \
              'BEGIN { printf "%.6f", candidate / baseline }')
            status=pass
            if ! awk -v ratio="$ratio" -v maximum="$maximum" \
              'BEGIN { exit !(ratio <= maximum) }'; then
              status=fail
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$case_name" "$artifact" "$baseline" "$candidate" \
              "$ratio" "$maximum" "$status" >> "$evidence/code-size.tsv"
            test "$status" = pass
          }

          for case_name in spectral-norm fannkuch-redux n-body; do
            case "$case_name" in
              spectral-norm)
                source=benchmarks/benchmarksgame/spectral-norm/src/main.trb
                expected=benchmarks/benchmarksgame/spectral-norm/expected/5500.txt
                input=5500
                code_limit=$selected_code_limit
                executable_limit=$selected_executable_limit
                runtime_limit=$selected_runtime_limit
                ;;
              fannkuch-redux)
                source=benchmarks/benchmarksgame/fannkuch-redux/src/main.trb
                expected=benchmarks/benchmarksgame/fannkuch-redux/expected/12.txt
                input=12
                code_limit=$control_limit
                executable_limit=$control_limit
                runtime_limit=$control_limit
                ;;
              n-body)
                source=benchmarks/benchmarksgame/n-body/src/main.trb
                expected=benchmarks/benchmarksgame/n-body/expected/50000000.txt
                input=50000000
                code_limit=$control_limit
                executable_limit=$control_limit
                runtime_limit=$control_limit
                ;;
            esac
            for role in baseline candidate; do
              source_root=$GITHUB_WORKSPACE
              if test "$role" = baseline; then
                source_root=$RUNNER_TEMP/baseline-source
              fi
              directory="$workspace/$case_name/$role"
              compiler="$RUNNER_TEMP/$role-compiler"
              mkdir -p "$directory"
              "$compiler" emit-qbe "$source_root/$source" > "$directory/program.ssa"
              "$compiler" build "$source_root/$source" \
                --output "$directory/program" --qbe "$QBE" --cc /usr/bin/cc --target "$PROFILE"
            done
            baseline_qbe=$(wc -c < "$workspace/$case_name/baseline/program.ssa" | tr -d ' ')
            candidate_qbe=$(wc -c < "$workspace/$case_name/candidate/program.ssa" | tr -d ' ')
            baseline_text=$(executable_text_size "$workspace/$case_name/baseline/program")
            candidate_text=$(executable_text_size "$workspace/$case_name/candidate/program")
            baseline_executable=$(wc -c < "$workspace/$case_name/baseline/program" | tr -d ' ')
            candidate_executable=$(wc -c < "$workspace/$case_name/candidate/program" | tr -d ' ')
            compare_ratio "$case_name" target-neutral-qbe \
              "$baseline_qbe" "$candidate_qbe" "$code_limit"
            compare_ratio "$case_name" "$TARGET-text" \
              "$baseline_text" "$candidate_text" "$code_limit"
            if test "$case_name" = spectral-norm && \
              test "$strict_selected_code" -eq 1; then
              test "$candidate_qbe" -lt "$baseline_qbe"
              test "$candidate_text" -lt "$baseline_text"
            fi
            if test "$enforce_executable_ratio" -eq 1; then
              compare_ratio "$case_name" "$TARGET-executable" \
                "$baseline_executable" "$candidate_executable" "$executable_limit"
            fi
            if test "$case_name" = spectral-norm; then
              test "$candidate_qbe" -le "$qbe_limit"
              if test "$TARGET" = darwin-arm64; then
                candidate_qbe_sha256=$(shasum -a 256 "$workspace/$case_name/candidate/program.ssa" | awk '{print $1}')
              else
                candidate_qbe_sha256=$(sha256sum "$workspace/$case_name/candidate/program.ssa" | awk '{print $1}')
              fi
              {
                printf 'candidate_spectral_qbe_bytes=%s\n' "$candidate_qbe"
                printf 'candidate_spectral_qbe_sha256=%s\n' "$candidate_qbe_sha256"
              } > "$evidence/identities.txt"
            fi
            if test "$PROFILE" = linux-arm64-v0; then
              python3 tools/native-mir-guarded-multiply/measure.py \
                "$workspace/$case_name/baseline/program" \
                "$workspace/$case_name/candidate/program" \
                "$expected" \
                "$evidence/$case_name-runtime" \
                "$input" \
                "$runtime_limit"
              if test "$stable_array_header" -eq 1 && \
                test "$case_name" != spectral-norm; then
                python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if data["ratios"]["peakRss"] <= 1.02 else 1)' \
                  "$evidence/$case_name-runtime/summary.json"
              fi
            else
              for role in baseline candidate; do
                "$workspace/$case_name/$role/program" "$input" \
                  > "$workspace/$case_name/$role/stdout" \
                  2> "$workspace/$case_name/$role/stderr"
                cmp "$expected" "$workspace/$case_name/$role/stdout"
                test ! -s "$workspace/$case_name/$role/stderr"
              done
            fi
          done

      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-string-compactness-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/comparison-evidence
            ${{ runner.temp }}/application-evidence
            ${{ runner.temp }}/array-loop-recovery-evidence
            ${{ runner.temp }}/float-array-reduction-evidence
            ${{ runner.temp }}/guarded-multiply-evidence
            ${{ runner.temp }}/guarded-add-evidence
            ${{ runner.temp }}/stable-array-header-evidence
            ${{ runner.temp }}/baseline-bootstrap-evidence
            ${{ runner.temp }}/candidate-bootstrap-evidence
            ${{ runner.temp }}/baseline-bootstrap-metadata.json
            ${{ runner.temp }}/candidate-bootstrap-metadata.json
          if-no-files-found: error
          retention-days: 30

  verify-cross-target:
    name: Verify cross-target identity and combined size
    if: always()
    needs: compare-target
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@v5

      - name: Download target evidence
        uses: actions/download-artifact@v5
        with:
          pattern: static-string-compactness-*
          path: ${{ runner.temp }}/target-evidence

      - name: Enforce the cross-target contract
        run: |
          . tools/native-mir-transition-policy.sh
          native_mir_transition_markers_valid "$GITHUB_WORKSPACE"
          darwin="$RUNNER_TEMP/target-evidence/static-string-compactness-darwin-arm64/comparison-evidence/identities.txt"
          linux="$RUNNER_TEMP/target-evidence/static-string-compactness-linux-arm64/comparison-evidence/identities.txt"
          test -f "$darwin"
          test -f "$linux"
          darwin_size=$(awk -F= '$1 == "candidate_compiler_bytes" {print $2}' "$darwin")
          linux_size=$(awk -F= '$1 == "candidate_compiler_bytes" {print $2}' "$linux")
          darwin_baseline_size=$(awk -F= '$1 == "baseline_compiler_bytes" {print $2}' "$darwin")
          linux_baseline_size=$(awk -F= '$1 == "baseline_compiler_bytes" {print $2}' "$linux")
          darwin_text_size=$(awk -F= '$1 == "candidate_text_bytes" {print $2}' "$darwin")
          linux_text_size=$(awk -F= '$1 == "candidate_text_bytes" {print $2}' "$linux")
          darwin_recovery=$(awk -F= '$1 == "induction_phi_recovery" {print $2}' "$darwin")
          linux_recovery=$(awk -F= '$1 == "induction_phi_recovery" {print $2}' "$linux")
          darwin_reduction=$(awk -F= '$1 == "array_reduction_transition" {print $2}' "$darwin")
          linux_reduction=$(awk -F= '$1 == "array_reduction_transition" {print $2}' "$linux")
          darwin_loop_recovery=$(awk -F= '$1 == "array_loop_recovery" {print $2}' "$darwin")
          linux_loop_recovery=$(awk -F= '$1 == "array_loop_recovery" {print $2}' "$linux")
          darwin_float_reduction=$(awk -F= '$1 == "float_array_reduction" {print $2}' "$darwin")
          linux_float_reduction=$(awk -F= '$1 == "float_array_reduction" {print $2}' "$linux")
          darwin_guarded_multiply=$(awk -F= '$1 == "guarded_multiply" {print $2}' "$darwin")
          linux_guarded_multiply=$(awk -F= '$1 == "guarded_multiply" {print $2}' "$linux")
          darwin_guarded_add=$(awk -F= '$1 == "guarded_add" {print $2}' "$darwin")
          linux_guarded_add=$(awk -F= '$1 == "guarded_add" {print $2}' "$linux")
          darwin_stable_array_header=$(awk -F= '$1 == "stable_array_header" {print $2}' "$darwin")
          linux_stable_array_header=$(awk -F= '$1 == "stable_array_header" {print $2}' "$linux")
          test "$darwin_recovery" = "$linux_recovery"
          test "$darwin_reduction" = "$linux_reduction"
          test "$darwin_loop_recovery" = "$linux_loop_recovery"
          test "$darwin_float_reduction" = "$linux_float_reduction"
          test "$darwin_guarded_multiply" = "$linux_guarded_multiply"
          test "$darwin_guarded_add" = "$linux_guarded_add"
          test "$darwin_stable_array_header" = "$linux_stable_array_header"
          test "$darwin_size" -le "$NATIVE_MIR_DARWIN_COMPILER_LIMIT"
          test "$linux_size" -le "$NATIVE_MIR_LINUX_COMPILER_LIMIT"
          combined=$((darwin_size + linux_size))
          test "$combined" -le "$NATIVE_MIR_COMBINED_COMPILER_LIMIT"
          baseline_combined=$((darwin_baseline_size + linux_baseline_size))
          if test "$darwin_recovery" -eq 1 || \
            test "$darwin_loop_recovery" -eq 1 || \
            test "$darwin_float_reduction" -eq 1 || \
            test "$darwin_guarded_multiply" -eq 1 || \
            test "$darwin_guarded_add" -eq 1; then
            test "$combined" -le "$baseline_combined"
          fi
          darwin_qbe_size=$(awk -F= '$1 == "fixed_point_qbe_size" {print $2}' "$darwin")
          linux_qbe_size=$(awk -F= '$1 == "fixed_point_qbe_size" {print $2}' "$linux")
          darwin_qbe_sha256=$(awk -F= '$1 == "fixed_point_qbe_sha256" {print $2}' "$darwin")
          linux_qbe_sha256=$(awk -F= '$1 == "fixed_point_qbe_sha256" {print $2}' "$linux")
          test "$darwin_qbe_size" = "$linux_qbe_size"
          test "$darwin_qbe_sha256" = "$linux_qbe_sha256"
          if test "$darwin_stable_array_header" -eq 1; then
            test "$darwin_qbe_size" -le "$NATIVE_MIR_TARGET_NEUTRAL_QBE_LIMIT"
          else
            if test "$darwin_loop_recovery" -eq 1 || \
              test "$darwin_float_reduction" -eq 1 || \
              test "$darwin_guarded_multiply" -eq 1 || \
              test "$darwin_guarded_add" -eq 1; then
              test "$darwin_qbe_size" -le "$NATIVE_MIR_ARRAY_LOOP_QBE_LIMIT"
            else
              if test "$darwin_reduction" -eq 1; then
                test "$darwin_qbe_size" -le "$NATIVE_MIR_TARGET_NEUTRAL_QBE_LIMIT"
              fi
            fi
          fi
          candidate_spectral_qbe_bytes=not-applicable
          candidate_spectral_qbe_sha256=not-applicable
          guarded_evidence=not-applicable
          guarded_qbe_limit=0
          if test "$darwin_stable_array_header" -eq 1; then
            guarded_evidence=stable-array-header-evidence
            guarded_qbe_limit=$NATIVE_MIR_STABLE_ARRAY_HEADER_QBE_LIMIT
          else
            if test "$darwin_guarded_add" -eq 1; then
              guarded_evidence=guarded-add-evidence
              guarded_qbe_limit=$NATIVE_MIR_GUARDED_ADD_QBE_LIMIT
            else
              if test "$darwin_guarded_multiply" -eq 1; then
                guarded_evidence=guarded-multiply-evidence
                guarded_qbe_limit=$NATIVE_MIR_GUARDED_MULTIPLY_QBE_LIMIT
              fi
            fi
          fi
          if test "$guarded_evidence" != not-applicable; then
            darwin_guarded="$RUNNER_TEMP/target-evidence/static-string-compactness-darwin-arm64/$guarded_evidence/identities.txt"
            linux_guarded="$RUNNER_TEMP/target-evidence/static-string-compactness-linux-arm64/$guarded_evidence/identities.txt"
            test -f "$darwin_guarded"
            test -f "$linux_guarded"
            darwin_spectral_qbe_bytes=$(awk -F= '$1 == "candidate_spectral_qbe_bytes" {print $2}' "$darwin_guarded")
            linux_spectral_qbe_bytes=$(awk -F= '$1 == "candidate_spectral_qbe_bytes" {print $2}' "$linux_guarded")
            darwin_spectral_qbe_sha256=$(awk -F= '$1 == "candidate_spectral_qbe_sha256" {print $2}' "$darwin_guarded")
            linux_spectral_qbe_sha256=$(awk -F= '$1 == "candidate_spectral_qbe_sha256" {print $2}' "$linux_guarded")
            test "$darwin_spectral_qbe_bytes" = "$linux_spectral_qbe_bytes"
            test "$darwin_spectral_qbe_sha256" = "$linux_spectral_qbe_sha256"
            test "$darwin_spectral_qbe_bytes" -le "$guarded_qbe_limit"
            candidate_spectral_qbe_bytes=$darwin_spectral_qbe_bytes
            candidate_spectral_qbe_sha256=$darwin_spectral_qbe_sha256
          fi
          {
            printf 'darwin_arm64_compiler_bytes=%s\n' "$darwin_size"
            printf 'linux_arm64_compiler_bytes=%s\n' "$linux_size"
            printf 'baseline_combined_compiler_bytes=%s\n' "$baseline_combined"
            printf 'combined_compiler_bytes=%s\n' "$combined"
            printf 'combined_compiler_limit=%s\n' "$NATIVE_MIR_COMBINED_COMPILER_LIMIT"
            printf 'darwin_arm64_text_bytes=%s\n' "$darwin_text_size"
            printf 'linux_arm64_text_bytes=%s\n' "$linux_text_size"
            printf 'induction_phi_recovery=%s\n' "$darwin_recovery"
            printf 'array_reduction_transition=%s\n' "$darwin_reduction"
            printf 'array_loop_recovery=%s\n' "$darwin_loop_recovery"
            printf 'float_array_reduction=%s\n' "$darwin_float_reduction"
            printf 'guarded_multiply=%s\n' "$darwin_guarded_multiply"
            printf 'guarded_add=%s\n' "$darwin_guarded_add"
            printf 'stable_array_header=%s\n' "$darwin_stable_array_header"
            printf 'target_neutral_qbe_bytes=%s\n' "$darwin_qbe_size"
            printf 'target_neutral_qbe_sha256=%s\n' "$darwin_qbe_sha256"
            printf 'candidate_spectral_qbe_bytes=%s\n' "$candidate_spectral_qbe_bytes"
            printf 'candidate_spectral_qbe_sha256=%s\n' "$candidate_spectral_qbe_sha256"
          } > "$RUNNER_TEMP/cross-target.txt"

      - name: Upload cross-target evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-string-compactness-cross-target
          path: ${{ runner.temp }}/cross-target.txt
          if-no-files-found: error
          retention-days: 30
